    /* ===================== WORKER DASHBOARD ===================== */
    function WorkerDashboard({ usuario, estacion, onLogout, onToggleTheme, themeDark }) {
      const [currentTime, setCurrentTime] = useState(new Date());
      const [tab, setTab] = useState('venta');
      const [ventasWorker, setVentasWorker] = useState([
        { id: 1, fecha: formatFechaCorta(new Date()), hora: '08:12', producto: 'Diésel B5', cant: '20.00 gal', precioUnitario: 23.10, total: 462.00, metodo: 'Efectivo', comp: 'Boleta' },
        { id: 2, fecha: formatFechaCorta(new Date()), hora: '08:34', producto: 'Gasolina Regular', cant: '10.00 gal', precioUnitario: 19.90, total: 199.00, metodo: 'Yape', comp: 'Boleta' },
        { id: 3, fecha: formatFechaCorta(new Date()), hora: '09:05', producto: 'Diésel B5', cant: '40.00 gal', precioUnitario: 23.10, total: 924.00, metodo: 'Tarjeta', comp: 'Factura' },
      ]);
      const [metodoEditando, setMetodoEditando] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [printerSize, setPrinterSize] = useState(() => localStorage.getItem('grifos_kala_printer') || '58');
      const trabajadoresGlobal = useMemo(() => { try { const s = localStorage.getItem('grifos_kala_trabajadores'); return s ? JSON.parse(s) : TRABAJADORES_INIT; } catch { return TRABAJADORES_INIT; } }, []);
      const maquinasGlobal = useMemo(() => { try { const s = localStorage.getItem('grifos_kala_maquinas'); return s ? JSON.parse(s) : MAQUINAS_INIT; } catch { return MAQUINAS_INIT; } }, []);
      useEffect(() => { const t = setInterval(() => setCurrentTime(new Date()), 1000); return () => clearInterval(t); }, []);

      let trabajador = (trabajadoresGlobal || []).find(t => t.usuario === usuario) || TRABAJADORES_INIT.find(t => t.usuario === usuario);
      if (!trabajador) {
        const nf = usuario.charAt(0).toUpperCase() + usuario.slice(1);
        trabajador = { id: 999, nombre: nf, usuario, estacion: ESTACIONES[0], horario: horario({ Lun: { libre: false, ini: '06:00', fin: '14:00' }, Mar: { libre: false, ini: '06:00', fin: '14:00' }, Mié: { libre: false, ini: '06:00', fin: '14:00' }, Jue: { libre: false, ini: '06:00', fin: '14:00' }, Vie: { libre: false, ini: '06:00', fin: '14:00' }, Sáb: { libre: true }, Dom: { libre: true } }) };
      }

      const nombreMostrar = trabajador.nombre;
      const maquinasTrabajador = (() => {
        const ids = trabajador.maquinasAsignadas || [];
        const todas = maquinasGlobal || [];
        return ids.map(id => todas.find(m => m.id === id)).filter(Boolean);
      })();
      const ventasVisibles = [...ventasWorker];
      const totalVentas = ventasWorker.length;
      const montoTotal = ventasWorker.reduce((a, v) => a + v.total, 0);
      function cambiarMetodo(id, nuevoMetodo) {
        setVentasWorker(prev => prev.map(v => v.id === id ? { ...v, metodo: nuevoMetodo } : v));
        setMetodoEditando(null);
      }
      const now = new Date();
      const fechaLarga = now.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
      const fechaFormateada = fechaLarga.charAt(0).toUpperCase() + fechaLarga.slice(1);

      const isMobile = useIsMobile();
      return (<div style={{ minHeight: '100vh', background: C.bg, display: 'flex', flexDirection: 'column' }}>
        {/* ===== TOP BAR ===== */}
        <div style={{ background: C.panel, borderBottom: `1px solid ${C.border}`, padding: isMobile ? '10px 12px' : '12px 20px', display: 'flex', alignItems: 'center', gap: isMobile ? 8 : 16, flexWrap: 'nowrap' }}>
          <div style={{ flexShrink: 0 }}><Logo /></div>
          {!isMobile && (<>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 14px', borderRadius: 8, background: C.bg, border: `1px solid ${C.border}`, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>
              <WI.Building2 size={14} color={C.muted} /> {estacion}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>
              <WI.Clock size={14} color={C.muted} /> {fechaFormateada}
            </div>
            <div style={{ flex: 1 }} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: C.green }} />
              {nombreMostrar} · Trabajador
            </div>
          </>)}
          {isMobile && (<div style={{ width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 6, overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter', fontSize: 11, color: C.textDim, minWidth: 0, overflow: 'hidden' }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: C.green, flexShrink: 0 }} />
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nombreMostrar}</span>
            </div>
            <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
              <button onClick={onToggleTheme} type="button" style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '8px 10px', borderRadius: 8, background: C.amberSoft, border: `1.5px solid ${C.amber}`, color: C.amber, cursor: 'pointer', fontFamily: 'Inter', fontSize: 11, fontWeight: 600, minHeight: 40, flexShrink: 0, whiteSpace: 'nowrap' }}>
                <WI.Sun size={15} /> {themeDark ? 'Claro' : 'Oscuro'}
              </button>
              <button onClick={onLogout} type="button" style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '8px 10px', borderRadius: 8, background: 'none', border: `1px solid ${C.border}`, color: C.red, cursor: 'pointer', fontFamily: 'Inter', fontSize: 11, fontWeight: 600, minHeight: 40, flexShrink: 0, whiteSpace: 'nowrap' }}>
                <WI.LogOut size={15} /> Salir
              </button>
            </div>
          </div>)}
          {!isMobile && (<>
            <button onClick={onToggleTheme} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', borderRadius: 8, background: C.bg, border: `1px solid ${C.border}`, color: C.textDim, fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
              <WI.Sun size={14} color={C.amber} /> {themeDark ? 'Claro' : 'Oscuro'}
            </button>
            <button onClick={onLogout} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', borderRadius: 8, background: 'none', border: `1px solid ${C.border}`, color: C.textDim, fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
              <WI.LogOut size={14} /> Salir
            </button>
          </>)}
        </div>

        {/* ===== TABS ===== */}
        <div style={{ borderBottom: `1px solid ${C.border}`, padding: isMobile ? '10px 12px' : '12px 20px', display: 'flex', gap: isMobile ? 6 : 8, overflowX: 'auto' }}>
          {[{ id: 'venta', label: isMobile ? 'Venta' : 'Nueva venta', icon: WI.FilePlus }, { id: 'cierre', label: isMobile ? 'Cierre' : 'Cierre de turno', icon: WI.Receipt }].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: isMobile ? '10px 16px' : '9px 18px', borderRadius: 9, border: `1px solid ${tab === t.id ? C.amber : C.border}`, background: tab === t.id ? C.amberSoft : C.panel, color: tab === t.id ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: isMobile ? 12 : 13, fontWeight: 600, cursor: 'pointer', minHeight: 44, whiteSpace: 'nowrap' }}>
              <t.icon size={14} /> {t.label}
            </button>
          ))}
        </div>

        {/* ===== MOBILE SIDEBAR TOGGLE ===== */}
        {isMobile && (
          <div style={{ padding: '8px 12px', display: 'flex', gap: 8 }}>
            <button onClick={() => setSidebarOpen(!sidebarOpen)} type="button" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '10px 12px', borderRadius: 10, border: `1px solid ${sidebarOpen ? C.amber : C.border}`, background: sidebarOpen ? C.amberSoft : C.panel, color: sidebarOpen ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12, fontWeight: 600, cursor: 'pointer', minHeight: 44 }}>
              <WI.Receipt size={16} /> {sidebarOpen ? 'Ocultar resumen' : 'Ver resumen del turno'}
              <span style={{ marginLeft: 'auto', fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 700, color: C.amber }}>{money(montoTotal)}</span>
            </button>
          </div>
        )}

        {/* ===== CONTENT ===== */}
        <div style={{ flex: 1, padding: isMobile ? '12px' : '20px', display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 340px', gap: isMobile ? 12 : 20, maxWidth: 1200, margin: '0 auto', width: '100%', paddingBottom: isMobile ? '80px' : '20px' }}>
          {/* LEFT: Main content */}
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: isMobile ? '14px' : '24', overflowY: 'auto' }}>
            {tab === 'venta' ? (
              <WorkerNuevaVenta usuario={nombreMostrar} estacion={estacion} ventasWorker={ventasWorker} setVentasWorker={setVentasWorker} />
            ) : (
              <WorkerCierreTurno ventasWorker={ventasWorker} estacion={estacion} usuario={nombreMostrar} trabajador={trabajador} maquinas={maquinasGlobal} />
            )}
          </div>

          {/* RIGHT: Sidebar - Collapsible on mobile */}
          {(isMobile ? sidebarOpen : true) && (<div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 12 : 16 }}>
            {/* Turno card */}
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                <WI.Clock size={15} color={C.teal} />
                <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Turno actual · {estacion.split(' ').pop()}</span>
              </div>
              <div style={{ fontFamily: 'JetBrains Mono', fontSize: 32, fontWeight: 700, color: C.amber, letterSpacing: '0.02em' }}>{money(montoTotal)}</div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginTop: 4 }}>{ventasVisibles.length} venta{ventasVisibles.length !== 1 ? 's' : ''} pendiente{ventasVisibles.length !== 1 ? 's' : ''} · {nombreMostrar}</div>
            </div>

            {/* Ventas recientes */}
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, flex: 1, overflowY: 'auto' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 14 }}>Ventas recientes</div>
              {ventasVisibles.length === 0 ? (
                <div style={{ textAlign: 'center', padding: 30 }}><div style={{ fontSize: 28, marginBottom: 8 }}>🛒</div><div style={{ fontFamily: 'Inter', fontSize: 13, color: C.muted }}>Sin ventas registradas</div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginTop: 4 }}>Las ventas aparecerán aquí</div></div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {ventasVisibles.map((v) => (
                    <div key={v.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}`, position: 'relative' }}>
                      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: C.muted, minWidth: 38 }}>{v.hora}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.text, fontWeight: 500 }}>{v.producto}</div>
                        <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>{v.cant}</div>
                      </div>
                      <div style={{ position: 'relative' }}>
                        <button onClick={() => setMetodoEditando(metodoEditando === v.id ? null : v.id)} type="button" style={{ padding: '3px 8px', borderRadius: 5, fontSize: 10, fontWeight: 600, border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, background: v.metodo === 'Yape' ? C.purple + '22' : C.tealSoft, color: v.metodo === 'Yape' ? C.purple : C.teal }}>
                          {v.metodo} <WI.ChevronDown size={10} />
                        </button>
                        {metodoEditando === v.id && (
                          <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: 4, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, zIndex: 50, minWidth: 120, boxShadow: `0 4px 12px ${C.bg}` }}>
                            {METODOS_WORKER.map(m => (
                              <button key={m.id} onClick={() => cambiarMetodo(v.id, m.label)} type="button" style={{ display: 'block', width: '100%', padding: '6px 10px', borderRadius: 5, border: 'none', background: v.metodo === m.label ? C.amberSoft : 'transparent', color: v.metodo === m.label ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 11, textAlign: 'left', cursor: 'pointer' }}>
                                {m.label} {m.label === 'Efectivo' && <span style={{ color: C.muted, fontSize: 9 }}>(quitar de lista)</span>}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 700, color: C.amber }}>{money(v.total)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>)}
        </div>
      </div>);
    }

    /* ===================== MAIN APP ===================== */
    function App({ themeDark, setThemeDark }) {
      const [screen, setScreen] = useState('login');
      const [rol, setRol] = useState('trabajador');
      const [usuario, setUsuario] = useState('');
      const [seccion, setSeccion] = useState('resumen');
      const [estacion, setEstacion] = useState(ESTACIONES[0]);
      const isMobile = useIsMobile();
      // Theme is applied synchronously on every render so no component ever paints with a stale
      // palette. The App itself is NOT remounted on theme change (no key), which keeps the
      // session state (screen/usuario/rol) intact when the user toggles the color tone.
      const palette = themeDark ? DARK : LIGHT;
      C = palette;
      PRODUCTOS_BASE.forEach(p => {
        const idx = PRODUCTOS.findIndex(pp => pp.id === p.id);
        if (idx >= 0) {
          const col = PRODUCTOS_COLORS[p.id] || {};
          const tc = palette === DARK ? col.dark : col.light;
          if (tc) PRODUCTOS[idx] = { ...PRODUCTOS[idx], color: tc.color, soft: tc.soft };
        }
      });
      useEffect(() => {
        document.body.style.background = palette.bg;
      }, [palette]);
      function toggleTheme() { setThemeDark(!themeDark); }
      const [ventas, setVentas] = useState([
        { fecha: formatFechaCorta(new Date()), hora: '08:15', producto: 'Diésel B5', cant: '45.20 gal', precioUnitario: 23.10, total: 1044.12, metodo: 'Efectivo', comp: 'Boleta', serieBoleta: 'B001-00123', serieFactura: null, ruc: null, razonSocial: null, dniCliente: '48562190', nombreCliente: 'Milagros Condori', placa: null, items: [{ producto: 'Diésel B5', cant: '45.20 gal', precioUnitario: 23.10, total: 1044.12 }], itemCount: 1, esBancarizacion: false, trabajador: 'Milagros Condori' },
        { fecha: formatFechaCorta(new Date()), hora: '09:32', producto: 'Gasolina Regular', cant: '30.00 gal', precioUnitario: 19.90, total: 597.00, metodo: 'Yape', comp: 'Boleta', serieBoleta: 'B001-00124', serieFactura: null, ruc: null, razonSocial: null, dniCliente: '76901234', nombreCliente: 'Edwin Mamani', placa: 'ABC-123', items: [{ producto: 'Gasolina Regular', cant: '30.00 gal', precioUnitario: 19.90, total: 597.00 }], itemCount: 1, esBancarizacion: false, trabajador: 'Milagros Condori' },
        { fecha: formatFechaCorta(new Date()), hora: '10:45', producto: 'Diésel D-B5', cant: '60.50 gal', precioUnitario: 23.10, total: 1397.55, metodo: 'Transferencia', comp: 'Factura', serieBoleta: null, serieFactura: 'F001-00012', ruc: '20456789012', razonSocial: 'TRANSPORTES DEL SUR S.A.C.', dniCliente: null, nombreCliente: null, placa: 'XYZ-789', items: [{ producto: 'Diésel D-B5', cant: '60.50 gal', precioUnitario: 23.10, total: 1397.55 }], itemCount: 1, esBancarizacion: true, trabajador: 'Edwin Mamani' },
        { fecha: formatFechaCorta(new Date()), hora: '11:20', producto: 'Urea 32', cant: '120.00 kg', precioUnitario: 2.50, total: 300.00, metodo: 'Efectivo', comp: 'Boleta', serieBoleta: 'B001-00125', serieFactura: null, ruc: null, razonSocial: null, dniCliente: '10234567', nombreCliente: 'Carlos Huanca', placa: null, items: [{ producto: 'Urea 32', cant: '120.00 kg', precioUnitario: 2.50, total: 300.00 }], itemCount: 1, esBancarizacion: false, trabajador: 'Milagros Condori' },
        { fecha: formatFechaCorta(new Date()), hora: '13:05', producto: 'Diésel B5', cant: '55.80 gal', precioUnitario: 23.10, total: 1288.98, metodo: 'Tarjeta', comp: 'Factura', serieBoleta: null, serieFactura: 'F001-00013', ruc: '20987654321', razonSocial: 'AGRICOLA VALLE S.A.C.', dniCliente: null, nombreCliente: null, placa: 'DEF-456', items: [{ producto: 'Diésel B5', cant: '55.80 gal', precioUnitario: 23.10, total: 1288.98 }], itemCount: 1, esBancarizacion: true, trabajador: 'Edwin Mamani' },
      ]);

      function handleLogin(rolElegido, user) {
        setRol(rolElegido);
        setUsuario(user);
        setScreen(rolElegido === 'admin' ? 'admin' : 'worker');
        if (rolElegido === 'admin') setSeccion('resumen');
      }

      if (screen === 'login') return <LoginScreen onLogin={handleLogin} />;
      if (screen === 'worker') return (<WorkerDashboard usuario={usuario} estacion={estacion} onLogout={() => setScreen('login')} onToggleTheme={toggleTheme} themeDark={themeDark} />);

      const adminTabs = [
        { id: 'resumen', label: 'Resumen', Icon: I.LayoutDashboard },
        { id: 'tanques', label: 'Tanques', Icon: I.Gauge },
        { id: 'comprobantes', label: 'Comprobantes', Icon: I.FileText },
        { id: 'trabajadores', label: 'Trabajadores', Icon: I.Users },
        { id: 'vehiculos', label: 'Vehículos', Icon: I.Building2 },
      ];

      return (<div style={{ minHeight: '100vh', background: C.bg, display: 'flex', flexDirection: 'column' }}>
        {/* TOP BAR */}
        <div style={{ background: C.panel, borderBottom: `1px solid ${C.border}`, padding: isMobile ? '10px 12px' : '12px 20px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'stretch' : 'center', justifyContent: 'space-between', gap: isMobile ? 8 : 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}><Logo /><span style={{ fontFamily: 'Inter', fontSize: isMobile ? 11 : 12.5, color: C.textDim }}><I.Building2 size={14} color={C.muted} /> {estacion}</span></div>
            <div style={{ display: 'flex', alignItems: 'center', gap: isMobile ? 6 : 12, flexWrap: 'nowrap' }}>
              <select value={estacion} onChange={e => setEstacion(e.target.value)} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: isMobile ? '8px 10px' : '7px 12px', color: C.text, fontFamily: 'Inter', fontSize: isMobile ? 11 : 12.5, cursor: 'pointer', minWidth: isMobile ? 90 : 'auto', flexShrink: 0 }}>
                {ESTACIONES.map(e => <option key={e} value={e} style={{ background: C.panel }}>{e}</option>)}
              </select>
              <button onClick={toggleTheme} type="button" style={{ display: 'flex', alignItems: 'center', gap: 5, padding: isMobile ? '8px 10px' : '7px 14px', borderRadius: 8, background: C.amberSoft, border: `1.5px solid ${C.amber}`, color: C.amber, cursor: 'pointer', fontFamily: 'Inter', fontSize: isMobile ? 11 : 12, fontWeight: 600, minHeight: 36, flexShrink: 0, whiteSpace: 'nowrap' }}>
                <WI.Sun size={14} color={C.amber} /> {themeDark ? 'Claro' : 'Oscuro'}
              </button>
              <button onClick={() => setScreen('login')} type="button" style={{ display: 'flex', alignItems: 'center', gap: 5, background: 'none', border: `1px solid ${C.border}`, borderRadius: 8, padding: isMobile ? '8px 10px' : '7px 14px', color: C.red, cursor: 'pointer', fontFamily: 'Inter', fontSize: isMobile ? 11 : 12, fontWeight: 600, minHeight: 36, flexShrink: 0, whiteSpace: 'nowrap' }}>
                <I.LogOut size={14} color={C.red} /> {!isMobile && 'Salir'}
              </button>
            </div>
          </div>
        </div>
        {/* TABS */}
        <div style={{ borderBottom: `1px solid ${C.border}`, padding: isMobile ? '10px 12px' : '12px 20px', overflowX: 'auto' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}><TabBar tabs={adminTabs} active={seccion} onChange={setSeccion} /></div>
        </div>
        {/* CONTENT */}
        <div style={{ flex: 1, padding: isMobile ? '14px 12px' : '22px 20px', paddingBottom: isMobile ? '80px' : '22px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            {seccion === 'resumen' && <ResumenAdmin estacion={estacion} />}
            {seccion === 'tanques' && <ControlTanquesAdmin estacion={estacion} />}
            {seccion === 'comprobantes' && <ComprobantesAdmin estacion={estacion} ventas={ventas} setVentas={setVentas} productos={PRODUCTOS} />}
            {seccion === 'trabajadores' && <TrabajadoresAdmin />}
            {seccion === 'vehiculos' && <VehiculosAdmin estacion={estacion} />}
          </div>
        </div>
      </div>);
    }

    /* ===================== RENDER ===================== */
    window.onerror = function(msg, src, line, col, err) { document.getElementById('root').innerHTML = '<div style="padding:20px;color:#f44;font-family:monospace;background:#1a1a1a;min-height:100vh"><h2>❌ Error</h2><pre style="white-space:pre-wrap;margin-top:10px;font-size:13px">' + msg + '\nLine: ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '') + '</pre></div>'; };
    function AppWrapper() {
      const [themeDark, setThemeDark] = useState(true);
      return <App themeDark={themeDark} setThemeDark={setThemeDark} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);
  </script>
</body>
</html>
