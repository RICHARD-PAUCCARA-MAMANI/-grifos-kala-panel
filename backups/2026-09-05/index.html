                      <input type="number" step="0.01" min="0" value={v.galonesConsumidos || ''} onChange={e => actualizarCampo(v.id, 'galonesConsumidos', e.target.value)} placeholder="0" style={{ width: 80, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 5, padding: '5px 7px', color: C.amber, fontFamily: 'JetBrains Mono', fontSize: 14, fontWeight: 700, textAlign: 'right', boxSizing: 'border-box' }} />
                      <span style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>gal</span>
                    </div>
                  </div>
                  <div style={{ background: C.bg, borderRadius: 8, padding: '10px 12px' }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, marginBottom: 4, textTransform: 'uppercase' }}>Viáticos</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.green }}>S/</span>
                      <input type="number" step="0.01" min="0" value={v.viaticos || ''} onChange={e => actualizarCampo(v.id, 'viaticos', e.target.value)} placeholder="0.00" style={{ width: 90, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 5, padding: '5px 7px', color: C.green, fontFamily: 'JetBrains Mono', fontSize: 14, fontWeight: 700, textAlign: 'right', boxSizing: 'border-box' }} />
                    </div>
                  </div>
                  <div style={{ background: C.bg, borderRadius: 8, padding: '10px 12px' }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, marginBottom: 4, textTransform: 'uppercase' }}>Reposición</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.blue }}>S/</span>
                      <input type="number" step="0.01" min="0" value={v.reposiciones || ''} onChange={e => actualizarCampo(v.id, 'reposiciones', e.target.value)} placeholder="0.00" style={{ width: 90, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 5, padding: '5px 7px', color: C.blue, fontFamily: 'JetBrains Mono', fontSize: 14, fontWeight: 700, textAlign: 'right', boxSizing: 'border-box' }} />
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Resumen por tipo */}
        {filtrados.length > 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2, 1fr)', gap: 12 }}>
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 12, fontWeight: 600, color: C.text, marginBottom: 10 }}>🛢️ Resumen Cisternas</div>
              {vehiculos.filter(v => v.tipo === 'cisterna' && v.estacion === estacion).length === 0 ? (
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Sin cisternas</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {vehiculos.filter(v => v.tipo === 'cisterna' && v.estacion === estacion).map(v => (
                    <div key={v.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 8px', background: C.bg, borderRadius: 6 }}>
                      <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim }}>{v.placa}</span>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, fontWeight: 700, color: C.amber }}>{(v.galonesConsumidos || 0).toLocaleString()} gal</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 12, fontWeight: 600, color: C.text, marginBottom: 10 }}>🚗 Resumen Vehículos Normales</div>
              {vehiculos.filter(v => v.tipo === 'normal' && v.estacion === estacion).length === 0 ? (
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Sin vehículos normales</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {vehiculos.filter(v => v.tipo === 'normal' && v.estacion === estacion).map(v => (
                    <div key={v.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 8px', background: C.bg, borderRadius: 6 }}>
                      <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim }}>{v.placa}</span>
                      <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, fontWeight: 700, color: C.teal }}>{(v.galonesConsumidos || 0).toLocaleString()} gal</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        <div style={{ background: C.tealSoft, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, display: 'flex', gap: 10 }}>
          <I.ShieldCheck size={16} color={C.teal} style={{ flexShrink: 0, marginTop: 2 }} />
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim, lineHeight: 1.6 }}>Registra el consumo de galones, viáticos y reposiciones por vehículo. Los datos se guardan automáticamente y se filtran por estación.</div>
        </div>
      </div>);
    }


    const WI = {
      Fuel: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/><path d="M15 10h2a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2v0a2 2 0 0 0 2-2V9l-3-3"/><path d="M3 22h12"/><path d="M7 7v5"/></svg>,
      Droplet: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>,
      Gauge: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>,
      CreditCard: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>,
      Banknote: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>,
      Smartphone: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
      ArrowLeftRight: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>,
      FileText: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>,
      Check: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
      Receipt: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>,
      Percent: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>,
      LogOut: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
      Sun: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
      Clock: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      Building2: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>,
      FilePlus: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg>,
      Plus: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
      ChevronDown: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
      Trash2: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke={p.color||"currentColor"} strokeWidth={p.strokeWidth||2} strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
    };

    /* ===================== WORKER: NUEVA VENTA ===================== */
    function WorkerNuevaVenta({ usuario, estacion, ventasWorker, setVentasWorker }) {
      const isMobile = useIsMobile();
      const [printerSize, setPrinterSize] = useState(() => localStorage.getItem('grifos_kala_printer') || '58');

      const [precioTick, setPrecioTick] = useState(0);
      // Sincronizar precios desde localStorage (actualizados por Admin)
      useEffect(() => {
        function sincronizarPrecios() {
          try {
            const s = localStorage.getItem('grifos_kala_precios');
            if (s) {
              const precios = JSON.parse(s);
              const mapaIds = { diesel: ['diesel', 'diesel4'], regular: ['regular'], urea: ['urea'] };
              Object.entries(precios).forEach(([grupoId, precio]) => {
                (mapaIds[grupoId] || []).forEach(pid => {
                  const idx = PRODUCTOS.findIndex(p => p.id === pid);
                  if (idx >= 0 && precio > 0) PRODUCTOS[idx] = { ...PRODUCTOS[idx], precio };
                });
              });
              setPrecioTick(t => t + 1);
            }
          } catch {}
        }
        sincronizarPrecios();
        window.addEventListener('preciosActualizados', sincronizarPrecios);
        window.addEventListener('storage', sincronizarPrecios);
        return () => {
          window.removeEventListener('preciosActualizados', sincronizarPrecios);
          window.removeEventListener('storage', sincronizarPrecios);
        };
      }, []);

      const [productoId, setProductoId] = useState(PRODUCTOS[0].id);
      const [cantidad, setCantidad] = useState('');
      const [porSoles, setPorSoles] = useState(false);
      const [metodoPago, setMetodoPago] = useState('Efectivo');
      const [tipoComprobante, setTipoComprobante] = useState('Boleta');
      const [carrito, setCarrito] = useState([]);
      // Datos del cliente
      const [clienteNombre, setClienteNombre] = useState('');
      const [clienteDoc, setClienteDoc] = useState('');
      const [clienteDireccion, setClienteDireccion] = useState('');
      const [clientePlaca, setClientePlaca] = useState('');
      const [cargandoCliente, setCargandoCliente] = useState(false);

      // Auto-lookup DNI/RUC cuando cambia el documento
      useEffect(() => {
        const doc = clienteDoc.trim();
        if (tipoComprobante === 'Factura' && doc.length === 11 && /^\d{11}$/.test(doc)) {
          setCargandoCliente(true);
          consultarRUC(doc).then(res => {
            setCargandoCliente(false);
            if (res.ok) {
              setClienteNombre(res.nombre || '');
              setClienteDireccion(res.direccion || '');
            }
          });
        } else if (tipoComprobante === 'Boleta' && doc.length === 8 && /^\d{8}$/.test(doc)) {
          setCargandoCliente(true);
          consultarDNI(doc).then(res => {
            setCargandoCliente(false);
            if (res.ok) setClienteNombre(res.nombre || '');
          });
        }
      }, [clienteDoc, tipoComprobante]);

      const METODOS_PAGO = [
        { id: 'efectivo', label: 'Efectivo', icon: WI.Banknote, color: C.green },
        { id: 'tarjeta', label: 'Tarjeta', icon: WI.CreditCard, color: C.teal },
        { id: 'yape', label: 'Yape', icon: WI.Smartphone, color: '#7B2D8E' },
        { id: 'transferencia', label: 'Transferencia', icon: WI.ArrowLeftRight, color: C.blue },
        { id: 'deposito', label: 'Depósito', icon: WI.FileText, color: C.amber },
      ];

      const producto = PRODUCTOS.find(p => p.id === productoId);
      const numCantidad = parseFloat(cantidad) || 0;
      let subtotalItem = 0;
      if (producto && numCantidad > 0) {
        subtotalItem = porSoles ? numCantidad : numCantidad * producto.precio;
      }
      const subtotalCarrito = carrito.reduce((a, it) => a + it.total, 0);
      const totalGeneral = subtotalCarrito;

      function agregarAlCarrito() {
        if (!producto || numCantidad <= 0) return;
        const galonesLitros = porSoles ? (numCantidad / producto.precio) : numCantidad;
        const total = porSoles ? numCantidad : numCantidad * producto.precio;
        setCarrito(prev => [...prev, {
          id: Date.now(),
          producto: producto.nombre,
          productoId: producto.id,
          cant: galonesLitros.toFixed(2) + ' ' + producto.unidad,
          precioUnitario: producto.precio,
          total: Math.round(total * 100) / 100,
        }]);
        setCantidad('');
      }

      function eliminarDelCarrito(id) {
        setCarrito(prev => prev.filter(it => it.id !== id));
      }

      function imprimirComprobante(ventaRegistrada) {
        // printerSize: '58' | '80' | 'a4'
        const size = printerSize;
        const isA4 = size === 'a4';
        const bodyWidth = size === '58' ? '52mm' : size === '80' ? '72mm' : '180mm';
        const pageWidth = size === '58' ? '58mm' : size === '80' ? '80mm' : 'A4';
        const popupW = isA4 ? 900 : 400;
        const popupH = isA4 ? 1100 : 900;
        const w = window.open('', '_blank', `width=${popupW},height=${popupH}`);
        const now = new Date();
        const fecha = now.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const hora = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        const esFactura = ventaRegistrada.comp === 'Factura';
        const sub = (ventaRegistrada.total / 1.18);
        const igv = (ventaRegistrada.total - sub);

        // Scale factor: 58mm=1, 80mm=1.25, A4=2.2
        const s = size === '58' ? 1 : size === '80' ? 1.25 : 2.2;

        let itemsHtml = '';
        ventaRegistrada.items.forEach(it => {
          itemsHtml += `<tr style='border-bottom:${1.5*s}px dotted #999'>
            <td style='padding:${2*s}mm 0;font-weight:800;font-size:${10*s}px'>${it.producto}</td>
            <td style='padding:${2*s}mm 0;text-align:right;font-weight:900;font-size:${11*s}px;white-space:nowrap'>S/ ${it.total.toFixed(2)}</td>
          </tr>
          <tr style='border-bottom:none'>
            <td style='padding:0 0 ${2*s}mm ${2*s}mm;font-size:${8*s}px;color:#333;font-weight:700' colspan='2'>${parseFloat(it.cant).toFixed(2)} ${it.unidad || 'gal'} x S/ ${it.precioUnitario.toFixed(2)}</td>
          </tr>`;
        });

        const fontStack = isA4 ? "'Georgia', 'Palatino Linotype', 'Book Antiqua', Palatino, serif" : "'Arial Narrow', Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif";
        const padBody = isA4 ? '15mm 20mm' : `${3*s}mm ${3*s}mm`;

        w.document.write(`<!DOCTYPE html><html><head><meta charset='utf-8'><title>Comprobante</title>
<link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&display=swap' rel='stylesheet'>
<style>
  @page { size: ${pageWidth} auto; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ${fontStack}; padding: ${padBody}; width: ${bodyWidth}; font-size: ${9*s}px; font-weight: 400; color: #000; background: #fff; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; letter-spacing: ${0.2*s}px; }
  .c { text-align: center; }
  .b { font-weight: 700; }
  .sep { border-top: ${1*s}px dashed #000; margin: ${2*s}mm 0; }
  .sep2 { border-top: ${2.5*s}px solid #000; margin: ${2*s}mm 0; }
  .sep3 { border-top: ${1*s}px solid #999; margin: ${1.5*s}mm 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row-label { display: flex; gap: ${2*s}mm; align-items: baseline; }
  .label { font-weight: 700; text-transform: uppercase; white-space: nowrap; }
  .small { font-size: ${7*s}px; font-weight: 400; }
  .big { font-size: ${12*s}px; font-weight: 700; }
  .total-box { border: ${2*s}px solid #000; padding: ${2*s}mm ${3*s}mm; margin: ${2*s}mm 0; }
  .total-row { font-size: ${12*s}px; font-weight: 900; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: ${7*s}px; font-weight: 700; text-transform: uppercase; border-bottom: ${1*s}px solid #000; padding: ${1*s}mm 0; text-align: left; }
  td { padding: ${0.8*s}mm 0; font-size: ${8*s}px; font-weight: 400; }
  .th-r { text-align: right; }
  .td-r { text-align: right; }
  .cut { border-top: ${1.5*s}px dashed #000; margin-top: ${3*s}mm; padding-top: ${2*s}mm; text-align: center; font-size: ${7*s}px; color: #666; }
  @media print { body { padding: ${padBody}; width: ${bodyWidth}; } }
</style></head><body>

<!-- ═══ ENCABEZADO ═══ -->
<div class='c'>
  <div style='font-family:Playfair Display,Georgia,serif;font-size:${22*s}px;font-weight:900;letter-spacing:${1*s}px;color:#1a1a1a'>GRIFOS KALA</div>
  <div style='font-size:${10*s}px;font-weight:900;margin-top:${1*s}mm;color:#333'>${EMPRESA.razonSocial}</div>
  <div style='font-size:${8*s}px;font-weight:400;margin-top:${1*s}mm;color:#555'>${EMPRESA.direccion}</div>
  <div style='font-size:${8*s}px;font-weight:400;color:#555'>${EMPRESA.distrito} - ${EMPRESA.provincia} - ${EMPRESA.ciudad}</div>
  <div style='font-size:${8*s}px;font-weight:600;color:#333'>TEL: ${EMPRESA.telefono}</div>
</div>

<div class='sep'></div>

<div class='c'>
  <div style='font-size:${11*s}px;font-weight:900;color:#1a1a1a'>RUC: ${EMPRESA.ruc}</div>
</div>

<div class='sep'></div>
<div class='sep2'></div>

<!-- ═══ TIPO DE COMPROBANTE ═══ -->
<div class='c'>
  <div style='font-family:Playfair Display,Georgia,serif;font-size:${13*s}px;font-weight:900;letter-spacing:${1.5*s}px;color:#1a1a1a'>${esFactura ? 'FACTURA' : 'BOLETA'} ELECTRÓNICA</div>
  <div style='font-size:${14*s}px;font-weight:900;margin-top:${1*s}mm;color:#000'>${ventaRegistrada.serie}</div>
</div>

<div class='sep'></div>
<div class='sep2'></div>

<!-- ═══ DATOS DEL CLIENTE ═══ -->
<div style='margin-bottom:${2*s}mm'>
  <div style='font-size:${10*s}px;font-weight:700;line-height:2;color:#1a1a1a'>
    <div class='row-label'><span class='label'>CLIENTE</span><span style='font-weight:400;color:#333'>: ${ventaRegistrada.clienteNombre || 'CLIENTE VARIOS'}</span></div>
    <div class='row-label'><span class='label'>${esFactura ? 'RUC' : 'DNI'}</span><span style='font-weight:400;color:#333'>: ${ventaRegistrada.clienteDoc || '---'}</span></div>
    ${ventaRegistrada.clienteDireccion ? `<div class='row-label'><span class='label'>DIRECCIÓN</span><span style='font-weight:400;color:#333'>: ${ventaRegistrada.clienteDireccion}</span></div>` : ''}
    ${ventaRegistrada.clientePlaca ? `<div class='row-label'><span class='label'>PLACA</span><span style='font-weight:400;color:#333'>: ${ventaRegistrada.clientePlaca}</span></div>` : ''}
  </div>
</div>

<div class='sep3'></div>

<!-- ═══ FECHA Y HORA ═══ -->
<div style='font-size:${9*s}px;font-weight:400;line-height:1.6'>
  <div class='row-label'><span class='label'>F. EMISIÓN</span><span style='color:#333'>: ${fecha}</span><span style='margin-left:auto;font-weight:900'>HORA: ${hora}</span></div>
  <div class='row-label'><span class='label'>MONEDA</span><span style='color:#333'>: SOLES</span></div>
</div>

<div class='sep'></div>

<!-- ═══ DETALLE DE PRODUCTOS ═══ -->
<div style='font-size:${10*s}px;font-weight:900;letter-spacing:${1*s}px;color:#1a1a1a;margin-bottom:${2*s}mm'>DETALLE DE PRODUCTOS</div>
<table>
  <thead><tr><th class='th' style='text-align:left'>Descripción</th><th class='th' style='text-align:right;width:${18*s}mm'>Total</th></tr></thead>
  <tbody>${itemsHtml}</tbody>
</table>

<div class='sep'></div>

<!-- ═══ TOTALES ═══ -->
${esFactura ? `<div style='margin-bottom:${2*s}mm'>
  <div class='row' style='font-size:${10*s}px;font-weight:700'><span style='color:#555'>Base:</span><span>S/ ${sub.toFixed(2)}</span></div>
  <div class='row' style='font-size:${10*s}px;font-weight:700'><span style='color:#555'>IGV 18%:</span><span>S/ ${igv.toFixed(2)}</span></div>
</div>` : ''}
<div class='total-box'>
  <div class='row total-row'><span style='letter-spacing:${1*s}px'>TOTAL</span><span>S/ ${ventaRegistrada.total.toFixed(2)}</span></div>
</div>
<div style='font-size:${9*s}px;font-weight:600;margin:${2*s}mm 0;color:#333;line-height:1.6'>Son: <b style='color:#000'>${numeroALetras(ventaRegistrada.total)}</b></div>

<div class='sep'></div>

<!-- ═══ FORMA DE PAGO ═══ -->
<div style='margin-bottom:${2.5*s}mm'>
  <div style='font-size:${10*s}px;font-weight:900;letter-spacing:${1*s}px;color:#1a1a1a;margin-bottom:${1.5*s}mm'>FORMA DE PAGO</div>
  <div style='font-size:${10*s}px;font-weight:700;line-height:1.8'>
    <div class='row'><span style='color:#555'>Pago:</span><span class='b'>${ventaRegistrada.metodo}</span></div>
    <div class='row'><span style='color:#555'>Atendido:</span><span class='b'>${ventaRegistrada.trabajador}</span></div>
  </div>
</div>

<div class='sep'></div>

<!-- ═══ PIE ═══ -->
<div class='c small' style='line-height:1.6;color:#666'>Rep. impresa de la ${esFactura ? 'factura' : 'boleta'}<br>electrónica</div>
<div class='c' style='margin-top:${4*s}mm;font-family:Playfair Display,Georgia,serif;font-size:${14*s}px;font-weight:900;letter-spacing:${0.5*s}px;color:#1a1a1a'>¡GRACIAS!</div>

<div class='cut'>✂ - - - - - - - - - - - - ✂</div>

</body></html>`);
        w.document.close();
        setTimeout(() => { w.print(); }, 500);
      }

      function registrarVenta() {
        if (carrito.length === 0) return;
        const now = new Date();
        const serie = tipoComprobante === 'factura' ? 'F001-' + String(Math.floor(Math.random() * 99999) + 1).padStart(5, '0') : 'B001-' + String(Math.floor(Math.random() * 99999) + 1).padStart(5, '0');
        const ventaRegistrada = {
          id: Date.now(),
          fecha: formatFechaCorta(now),
          hora: now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }),
          producto: carrito[0].producto,
          cant: carrito.map(c => c.cant).join(' + '),
          precioUnitario: carrito[0].precioUnitario,
          total: totalGeneral,
          metodo: metodoPago,
          comp: tipoComprobante,
          serie,
          trabajador: usuario,
          clienteNombre,
          clienteDoc,
          clienteDireccion,
          clientePlaca,
          items: carrito.map(c => ({ producto: c.producto, cant: c.cant, precioUnitario: c.precioUnitario, total: c.total, unidad: c.cant.includes('litros') ? 'LTR' : 'GLL' })),
        };
        setVentasWorker(prev => [...prev, ventaRegistrada]);
        imprimirComprobante(ventaRegistrada);
        setCarrito([]);
        setClienteNombre(''); setClienteDoc(''); setClienteDireccion(''); setClientePlaca('');
      }

      return (<div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ fontFamily: 'Oswald', fontSize: 16, fontWeight: 700, color: C.text, textTransform: 'uppercase', letterSpacing: '0.03em' }}>🛒 NUEVA VENTA</div>

        {/* 1. SELECCIONAR PRODUCTO */}
        <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>1. Selecciona el producto</div>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 8 }}>
            {PRODUCTOS.filter(p => p.id !== 'diesel4').map(p => (
              <button key={p.id} onClick={() => setProductoId(p.id)} type="button" style={{ padding: '12px 10px', borderRadius: 10, border: `2px solid ${productoId === p.id ? p.color : C.border}`, background: productoId === p.id ? p.soft : C.panel, cursor: 'pointer', textAlign: 'center' }}>
                <div style={{ fontFamily: 'Oswald', fontSize: 13, fontWeight: 600, color: productoId === p.id ? p.color : C.textDim, textTransform: 'uppercase' }}>{p.nombre}</div>
                <div style={{ fontFamily: 'JetBrains Mono', fontSize: 15, fontWeight: 700, color: p.color, marginTop: 4 }}>S/ {p.precio.toFixed(2)}</div>
                <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted }}>/ {p.unidad}</div>
              </button>
            ))}
          </div>
        </div>

        {/* 2. CANTIDAD */}
        {producto && (
          <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>2. ¿Cómo te lo piden?</div>
            <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
              <button onClick={() => setPorSoles(true)} type="button" style={{ padding: '8px 16px', borderRadius: 8, border: `1px solid ${porSoles ? C.amber : C.border}`, background: porSoles ? C.amberSoft : 'transparent', color: porSoles ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Por soles</button>
              <button onClick={() => setPorSoles(false)} type="button" style={{ padding: '8px 16px', borderRadius: 8, border: `1px solid ${!porSoles ? producto.color : C.border}`, background: !porSoles ? producto.soft : 'transparent', color: !porSoles ? producto.color : C.textDim, fontFamily: 'Inter', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Por {producto.unidad}</button>
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 4 }}>{porSoles ? 'Monto en soles' : 'Cantidad en ' + producto.unidad}</div>
                <input type="number" step="0.01" min="0" placeholder={porSoles ? 'S/ 0.00' : 'Cantidad en ' + producto.unidad} value={cantidad} onChange={e => setCantidad(e.target.value)} onKeyDown={e => e.key === 'Enter' && agregarAlCarrito()} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', color: C.text, fontFamily: 'JetBrains Mono', fontSize: 14, boxSizing: 'border-box' }} />
              </div>
              <div style={{ fontFamily: 'JetBrains Mono', fontSize: 16, fontWeight: 700, color: producto.color, minWidth: 100, textAlign: 'right' }}>S/ {subtotalItem.toFixed(2)}</div>
              <button onClick={agregarAlCarrito} type="button" style={{ padding: '10px 16px', borderRadius: 8, background: producto.color, color: '#fff', border: 'none', fontFamily: 'Inter', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}><WI.Plus size={14} /> Agregar</button>
            </div>
          </div>
        )}

        {/* CARRITO */}
        {carrito.length > 0 && (
          <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>Carrito ({carrito.length} items)</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {carrito.map(it => (
                <div key={it.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: C.panel, borderRadius: 8, border: `1px solid ${C.border}` }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.text, fontWeight: 500 }}>{it.producto}</div>
                    <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>{it.cant} × S/ {it.precioUnitario.toFixed(2)}</div>
                  </div>
                  <div style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 700, color: C.amber }}>S/ {it.total.toFixed(2)}</div>
                  <button onClick={() => eliminarDelCarrito(it.id)} type="button" style={{ background: 'none', border: 'none', color: C.red, cursor: 'pointer', padding: 4 }}><WI.Trash2 size={14} /></button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* 3. FORMA DE PAGO */}
        <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>3. Forma de pago</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {METODOS_PAGO.map(m => (
              <button key={m.id} onClick={() => setMetodoPago(m.label)} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 8, border: `1.5px solid ${metodoPago === m.label ? m.color : C.border}`, background: metodoPago === m.label ? m.color + '22' : 'transparent', color: metodoPago === m.label ? m.color : C.textDim, fontFamily: 'Inter', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>
                <m.icon size={14} /> {m.label}
              </button>
            ))}
          </div>
        </div>

        {/* 4. COMPROBANTE + CLIENTE */}
        <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginBottom: 10, fontWeight: 600 }}>4. Comprobante</div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
            {[{ label: 'Boleta' }, { label: 'Factura' }, { label: 'Nota de venta' }].map(c => (
              <button key={c.label} onClick={() => setTipoComprobante(c.label)} type="button" style={{ padding: '8px 16px', borderRadius: 8, border: `1.5px solid ${tipoComprobante === c.label ? C.amber : C.border}`, background: tipoComprobante === c.label ? C.amberSoft : 'transparent', color: tipoComprobante === c.label ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>{c.label}</button>
            ))}
          </div>
          {/* Datos del cliente */}
          <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Datos del cliente</div>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2, 1fr)', gap: 8 }}>
            <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 3 }}>Nombre / Razón Social</div><input placeholder="Nombre del cliente" value={clienteNombre} onChange={e => setClienteNombre(e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '7px 10px', color: C.text, fontFamily: 'Inter', fontSize: 12, boxSizing: 'border-box' }} />{clienteNombre && <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.green, marginTop: 3 }}>✅ Auto-detectado</div>}</div>
            <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 3 }}>{tipoComprobante === 'Factura' ? 'RUC' : 'DNI'}</div><div style={{ position: 'relative' }}><input placeholder={tipoComprobante === 'Factura' ? 'RUC (11 dígitos)' : 'DNI (8 dígitos)'} value={clienteDoc} onChange={e => setClienteDoc(e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '7px 10px', paddingRight: cargandoCliente ? 32 : 10, color: C.text, fontFamily: 'JetBrains Mono', fontSize: 12, boxSizing: 'border-box' }} />{cargandoCliente && <div style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', color: C.amber, fontSize: 11 }}>⏳</div>}</div></div>
            {tipoComprobante === 'Factura' && <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 3 }}>Dirección</div><input placeholder="Dirección fiscal" value={clienteDireccion} onChange={e => setClienteDireccion(e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '7px 10px', color: C.text, fontFamily: 'Inter', fontSize: 12, boxSizing: 'border-box' }} /></div>}
            <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 3 }}>Placa (opcional)</div><input placeholder="ABC-123" value={clientePlaca} onChange={e => setClientePlaca(e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '7px 10px', color: C.text, fontFamily: 'JetBrains Mono', fontSize: 12, boxSizing: 'border-box' }} /></div>
          </div>
        </div>

        {/* 5. TOTAL + REGISTRAR */}
        <div style={{ background: C.amberSoft, border: `2px solid ${C.amber}`, borderRadius: 12, padding: isMobile ? 12 : 16 }}>
          <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'stretch' : 'center', justifyContent: 'space-between', gap: 12 }}>
            <div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Total a cobrar</div>
              <div style={{ fontFamily: 'JetBrains Mono', fontSize: isMobile ? 22 : 26, fontWeight: 700, color: C.amber }}>S/ {totalGeneral.toFixed(2)}</div>
            </div>
            <button onClick={registrarVenta} disabled={carrito.length === 0} type="button" style={{ padding: isMobile ? '14px 20px' : '12px 28px', borderRadius: 10, background: carrito.length > 0 ? C.amber : C.border, color: carrito.length > 0 ? C.bg : C.muted, border: 'none', fontFamily: 'Inter', fontWeight: 700, fontSize: isMobile ? 13 : 14, cursor: carrito.length > 0 ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, minHeight: 48 }}>
              🖨️ Registrar e imprimir
            </button>
          </div>
          {/* Selector de tamaño de papel */}
          <div style={{ marginTop: 10, borderTop: `1px solid ${C.border}`, paddingTop: 10, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, fontWeight: 600 }}>🖨️ Impresora:</span>
            {[{ id: '58', label: '58mm', desc: 'POS térmica' }, { id: '80', label: '80mm', desc: 'POS amplia' }, { id: 'a4', label: 'A4 / Carta', desc: 'Impresora normal' }].map(opt => (
              <button key={opt.id} onClick={() => { setPrinterSize(opt.id); localStorage.setItem('grifos_kala_printer', opt.id); }} type="button" style={{ padding: '6px 12px', borderRadius: 6, border: `1.5px solid ${printerSize === opt.id ? C.amber : C.border}`, background: printerSize === opt.id ? C.amberSoft : 'transparent', color: printerSize === opt.id ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 11, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
                {opt.label} <span style={{ fontSize: 9, opacity: 0.7, marginLeft: 2 }}>({opt.desc})</span>
              </button>
            ))}
          </div>
        </div>
      </div>);
    }

    /* ===================== WORKER: CIERRE DE TURNO ===================== */
    function WorkerCierreTurno({ ventasWorker, estacion, usuario, trabajador, maquinas: maquinasProp }) {
      const isMobile = useIsMobile();
      const [maquinasSeleccionadas, setMaquinasSeleccionadas] = useState([]);

      const maquinasDisponibles = useMemo(() => {
        let all = [];
        if (maquinasProp && maquinasProp.length > 0) all = maquinasProp;
        else if (trabajador && trabajador.maquinasAsignadas && trabajador.maquinasAsignadas.length > 0) {
          all = trabajador.maquinasAsignadas;
        }
        return all.filter(m => m.estacion === estacion);
      }, [maquinasProp, trabajador, estacion]);

      function toggleMaquinaSeleccionada(mId) {
        setMaquinasSeleccionadas(prev =>
          prev.includes(mId) ? prev.filter(x => x !== mId) : [...prev, mId]
        );
      }

      // Lecturas de manguera
      const [lecturas, setLecturas] = useState(() => {
        const init = {};
        PRODUCTOS.forEach(p => {
          init[p.id] = [];
          const numMangueras = p.mangueras || 2;
          for (let i = 0; i < numMangueras; i++) {
            init[p.id].push({ id: Date.now() + Math.random(), anterior: '', actual: '' });
          }
        });
        return init;
      });

      function setLectura(productoId, idx, campo, valor) {
        setLecturas(prev => ({
          ...prev,
          [productoId]: prev[productoId].map((r, i) => i === idx ? { ...r, [campo]: valor } : r)
        }));
      }

      function calcularGalones(productoId) {
        return (lecturas[productoId] || []).reduce((total, r) => {
          const ant = parseFloat(r.anterior) || 0;
          const act = parseFloat(r.actual) || 0;
          return total + Math.max(0, act - ant);
        }, 0);
      }

      function calcularMontoProducto(productoId) {
        const p = PRODUCTOS.find(pp => pp.id === productoId);
        return calcularGalones(productoId) * (p ? p.precio : 0);
      }

      const productosVisibles = useMemo(() => {
        if (maquinasSeleccionadas.length === 0) return [];
        const mapaProductoTanques = {}; // { productoId: Set de nombres de tanque }
        maquinasSeleccionadas.forEach(mId => {
          const m = maquinasDisponibles.find(mm => mm.id === mId);
          if (!m) return;
          const pid = m.productoId || ((m.isla || '').toLowerCase().includes('d2#3') || (m.isla || '').toLowerCase().includes('d2#4') ? 'diesel4' : (m.isla || '').toLowerCase().includes('d2#1') ? 'diesel' : (m.isla || '').toLowerCase().includes('regular') ? 'regular' : (m.isla || '').toLowerCase().includes('urea') ? 'urea' : null);
          if (!pid) return;
          if (!mapaProductoTanques[pid]) mapaProductoTanques[pid] = new Set();
          // Extraer el nombre del tanque del campo isla (ej: 'Tanques D2#3 y D2#4' → 'D2#3', 'D2#4')
          const isla = m.isla || '';
          const tanquesMatch = isla.match(/D2#\d+|Regular|Urea/gi);
          if (tanquesMatch) {
            tanquesMatch.forEach(t => mapaProductoTanques[pid].add(t.toUpperCase()));
          }
        });
        const pIds = Object.keys(mapaProductoTanques);
        if (pIds.length === 0) return [];
        return PRODUCTOS.filter(p => pIds.includes(p.id)).map(p => ({
          ...p,
          tanques: Array.from(mapaProductoTanques[p.id] || []).join(', ') || '—'
        }));
      }, [maquinasSeleccionadas, maquinasDisponibles]);

      // Paper size for cierre de turno printing
      const [cierrePrinterSize, setCierrePrinterSize] = useState(() => localStorage.getItem('grifos_kala_cierre_printer') || '58');
      useEffect(() => { localStorage.setItem('grifos_kala_cierre_printer', cierrePrinterSize); }, [cierrePrinterSize]);

      // Total mangueras = TODAS las ventas (efectivo + virtuales)
      const totalMangueras = ventasWorker.reduce((sum, v) => sum + v.total, 0);
      const totalGalonesMangueras = ventasWorker.reduce((sum, v) => {
        const gal = parseFloat(v.cant) || 0;
        return sum + gal;
      }, 0);

      // Ventas virtuales (no efectivo)
      const [ventasVirtuales, setVentasVirtuales] = useState(() =>
        ventasWorker.filter(v => v.metodo !== 'Efectivo').map(v => ({ ...v }))
      );
      const [metodoEditando, setMetodoEditando] = useState(null);

      function cambiarMetodoVenta(id, nuevoMetodo) {
        if (nuevoMetodo === 'Efectivo') {
          setVentasVirtuales(prev => prev.filter(v => v.id !== id));
        } else {
          setVentasVirtuales(prev => prev.map(v => v.id === id ? { ...v, metodo: nuevoMetodo } : v));
        }
        setMetodoEditando(null);
      }

      // Varillado (medición de tanques en cm)
      const [varillado, setVarillado] = useState(() => {
        const init = {};
        PRODUCTOS.forEach(p => { init[p.id] = ''; });
        return init;
      });

      // Gastos de turno
      const [gastos, setGastos] = useState([
        { id: 1, concepto: 'Consumo grifo BFM-914', monto: '', tipo: 'soles', productoId: 'diesel' },
        { id: 2, concepto: 'Viáticos y Peajes BFM-96Y', monto: '', tipo: 'soles', productoId: 'regular' },
        { id: 3, concepto: 'Pago externo', monto: '', tipo: 'soles', productoId: 'regular' },
      ]);
      const [nuevoGastoConcepto, setNuevoGastoConcepto] = useState('');
      const [nuevoGastoMonto, setNuevoGastoMonto] = useState('');
      const [nuevoGastoTipo, setNuevoGastoTipo] = useState('soles');
      const [nuevoGastoProducto, setNuevoGastoProducto] = useState('diesel');

      function calcularMontoGasto(g) {
        const monto = parseFloat(g.monto) || 0;
        if (g.tipo === 'galones') {
          const p = PRODUCTOS.find(pp => pp.id === g.productoId);
          return monto * (p ? p.precio : 0);
        }
        return monto;
      }

      function agregarGasto() {
        if (!nuevoGastoConcepto.trim() || !nuevoGastoMonto) return;
        setGastos(prev => [...prev, { id: Date.now(), concepto: nuevoGastoConcepto.trim(), monto: nuevoGastoMonto, tipo: nuevoGastoTipo, productoId: nuevoGastoProducto }]);
        setNuevoGastoConcepto('');
        setNuevoGastoMonto('');
      }

      function eliminarGasto(id) {
        setGastos(prev => prev.filter(g => g.id !== id));
      }

      function actualizarGasto(id, campo, valor) {
        setGastos(prev => prev.map(g => g.id === id ? { ...g, [campo]: valor } : g));
      }

      const totalGastos = gastos.reduce((sum, g) => sum + calcularMontoGasto(g), 0);
      const totalVentasVirtuales = ventasVirtuales.reduce((a, v) => a + v.total, 0);
      const efectivoFijo = totalMangueras - totalVentasVirtuales - totalGastos;

      const now = new Date();
      const fechaInicio = formatFechaCorta(now);
      const nombreTrabajador = trabajador ? trabajador.nombre : usuario;

      const METODOS_CIERRE = [
        { id: 'yape', label: 'Yape', color: '#7B2D8E' },
        { id: 'transferencia', label: 'Transferencia', color: C.blue },
        { id: 'tarjeta', label: 'Tarjeta', color: C.teal },
        { id: 'deposito', label: 'Depósito', color: C.green },
      ];

      function imprimirCierreTurno(tipo) {
        // 58mm: M1KC POS | 80mm: Basic 230 | A4: Epson L3250
        const w = window.open('', '_blank', tipo === 'a4' ? 'width=900,height=1100' : tipo === '80' ? 'width=400,height=1200' : 'width=320,height=1200');
        const now = new Date();
        const fecha = now.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const hora = now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        const nom = trabajador ? trabajador.nombre : usuario;

        // Build product rows (shared)
        let productRows = '';
        let productRowsA4 = '';
        productosVisibles.forEach(p => {
          const galones = calcularGalones(p.id);
          const monto = calcularMontoProducto(p.id);
          const lecturasProd = lecturas[p.id] || [];
          lecturasProd.forEach((r, idx) => {
            const ant = parseFloat(r.anterior) || 0;
            const act = parseFloat(r.actual) || 0;
            const gal = Math.max(0, act - ant);
            productRows += `<tr><td style='padding:1.5mm 0;font-weight:700' rowspan='${idx === 0 ? lecturasProd.length : 0}'>${idx === 0 ? p.nombre.substring(0,14) : ''}</td><td style='padding:1.5mm 0;text-align:right;font-weight:600'>${ant.toFixed(2)}</td><td style='padding:1.5mm 0;text-align:right;font-weight:600'>${act.toFixed(2)}</td><td style='padding:1.5mm 0;text-align:right;font-weight:700'>${gal.toFixed(2)}</td></tr>`;
            productRowsA4 += `<tr><td style='padding:3px 6px;font-weight:600' rowspan='${idx === 0 ? lecturasProd.length : 0}'>${idx === 0 ? p.nombre : ''}</td><td style='padding:3px 6px;text-align:right'>${ant.toFixed(2)}</td><td style='padding:3px 6px;text-align:right'>${act.toFixed(2)}</td><td style='padding:3px 6px;text-align:right;font-weight:700'>${gal.toFixed(2)}</td></tr>`;
          });
          if (lecturasProd.length > 0) {
            productRows += `<tr style='border-top:1.5px solid #000'><td colspan='3' style='padding:2.5mm 0;text-align:right;font-weight:700'>TOTAL ${p.nombre.substring(0,14)}</td><td style='padding:2.5mm 0;text-align:right;font-weight:700'>${galones.toFixed(2)} ${p.unidad}</td></tr>`;
            productRows += `<tr><td colspan='3' style='padding:1.5mm 0;text-align:right;color:#555;font-size:9px;font-weight:600'>${galones.toFixed(2)} x S/ ${p.precio.toFixed(2)}</td><td style='padding:1.5mm 0;text-align:right;font-weight:700'>S/ ${monto.toFixed(2)}</td></tr>`;
            productRowsA4 += `<tr style='background:#f9f9f6'><td colspan='3' style='padding:4px 6px;text-align:right;font-weight:700'>TOTAL ${p.nombre}</td><td style='padding:4px 6px;text-align:right;font-weight:700'>${galones.toFixed(2)} ${p.unidad}</td></tr>`;
            productRowsA4 += `<tr><td colspan='3' style='padding:2px 6px;text-align:right;color:#888;font-size:9px'>${galones.toFixed(2)} x S/ ${p.precio.toFixed(2)}</td><td style='padding:2px 6px;text-align:right;font-weight:700'>S/ ${monto.toFixed(2)}</td></tr>`;
          }
        });

        // Build virtual sales rows
        let virtualRows = '';
        let virtualRowsA4 = '';
        ventasVirtuales.forEach(v => {
          virtualRows += `<tr><td style='padding:1.5mm 0;font-weight:600'>${v.producto} (${v.metodo})</td><td style='padding:1.5mm 0;text-align:right;font-weight:600'>${v.cant}</td><td style='padding:1.5mm 0;text-align:right;font-weight:700'>S/ ${v.total.toFixed(2)}</td></tr>`;
          virtualRowsA4 += `<tr><td style='padding:3px 6px;font-weight:500'>${v.producto}</td><td style='padding:3px 6px;text-align:center'><span style='background:#7B2D8E22;color:#7B2D8E;padding:1px 6px;border-radius:3px;font-size:9px'>${v.metodo}</span></td><td style='padding:3px 6px;text-align:right'>${v.cant}</td><td style='padding:3px 6px;text-align:right;font-weight:700'>S/ ${v.total.toFixed(2)}</td></tr>`;
        });

        // Build gastos rows
        let gastosRows = '';
        let gastosRowsA4 = '';
        gastos.forEach(g => {
          if (g.monto && parseFloat(g.monto) > 0) {
            gastosRows += `<tr><td style='padding:1.5mm 0;font-weight:600'>${g.concepto}</td><td style='padding:1.5mm 0;text-align:right;font-weight:700'>- S/ ${parseFloat(g.monto).toFixed(2)}</td></tr>`;
            gastosRowsA4 += `<tr><td style='padding:3px 6px'>${g.concepto}</td><td style='padding:3px 6px;text-align:right;font-weight:600;color:#C0392B'>- S/ ${parseFloat(g.monto).toFixed(2)}</td></tr>`;
          }
        });

        // Build varillado rows
        let varilladoRows = '';
        let varilladoRowsA4 = '';
        productosVisibles.forEach(p => {
          if (varillado[p.id]) {
            varilladoRows += `<tr><td style='padding:1.5mm 0;font-weight:600'>${p.nombre}</td><td style='padding:1.5mm 0;text-align:right;font-weight:600'>${varillado[p.id]} cm</td></tr>`;
            varilladoRowsA4 += `<tr><td style='padding:3px 6px'>${p.nombre}</td><td style='padding:3px 6px;text-align:right'>${varillado[p.id]} cm</td></tr>`;
          }
        });



        const isA4 = tipo === 'a4';
        const is80mm = tipo === '80';

        if (isA4) {
          // ============ A4 FORMAT — REPORTE DE CIERRE DE TURNO ============
          w.document.write(`
<!DOCTYPE html>
<html><head><meta charset='utf-8'><title>Cierre de Turno - ${nom}</title>
<style>
  @page { size: A4; margin: 14mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: #1a1a1a; background: #fff; font-size: 10.5px; line-height: 1.4; padding: 14mm; }
  .hdr { text-align: center; border-bottom: 3px solid #C4841D; padding-bottom: 10px; margin-bottom: 14px; }
  .hdr h1 { font-size: 22px; color: #C4841D; letter-spacing: 3px; font-weight: 800; }
  .hdr .sub { font-size: 12px; color: #888; margin-top: 3px; font-weight: 600; }
  .meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; background: linear-gradient(135deg, #faf8f2, #f5f3ec); padding: 12px 16px; border-radius: 8px; border: 1px solid #e8e4da; }
  .meta div { display: flex; flex-direction: column; gap: 2px; }
  .meta .lbl { font-size: 8px; color: #999; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .meta .val { font-weight: 700; color: #1a1a1a; font-size: 12px; }
  .section-title { font-size: 11px; color: #C4841D; margin: 14px 0 8px; font-weight: 700; letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #e8e4da; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 10px; }
  th { background: #f8f6f0; padding: 6px 8px; text-align: left; font-weight: 700; border-bottom: 2px solid #d4d0c8; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.4px; color: #888; }
  td { border-bottom: 1px solid #f0ede6; padding: 5px 8px; }
  tr:hover td { background: #fdfcfa; }
  .tr td { background: #f8f6f0; font-weight: 700; border-top: 2px solid #C4841D; border-bottom: 2px solid #C4841D; padding: 7px 8px; }
  .card { background: #fff; border: 1px solid #e8e4da; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box-section { background: linear-gradient(135deg, #fdf8ed, #faf4e2); border: 2.5px solid #C4841D; border-radius: 10px; padding: 14px 18px; margin-top: 14px; }
  .box-section .title { font-size: 12px; color: #C4841D; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
  .box-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
  .box-card { background: #fff; border: 1px solid #e8e4da; border-radius: 8px; padding: 10px; text-align: center; }
  .box-card .lbl { font-size: 8px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .box-card .val { font-size: 17px; font-weight: 700; margin-top: 3px; }
  .box-final { text-align: center; margin-top: 10px; padding-top: 10px; border-top: 2.5px solid #C4841D; }
  .box-final .lbl { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .box-final .big { font-size: 24px; font-weight: 800; color: #C4841D; }
  .footer { text-align: center; margin-top: 16px; font-size: 8.5px; color: #bbb; border-top: 1px solid #eee; padding-top: 8px; }
  @media print { body { padding: 12mm; } }
</style></head><body>

<!-- ═══════════ ENCABEZADO ═══════════ -->
<div class='hdr'>
  <h1>⛽ GRIFOS KALA</h1>
  <div class='sub'>REPORTE DE CIERRE DE TURNO</div>
</div>

<!-- ═══════════ INFORMACIÓN DEL TURNO ═══════════ -->
<div class='meta'>
  <div><div class='lbl'>📅 Fecha</div><div class='val'>${fecha}</div></div>
  <div><div class='lbl'>👤 Trabajador</div><div class='val'>${nom}</div></div>
  <div><div class='lbl'>⛽ Estación</div><div class='val'>${estacion}</div></div>
  <div><div class='lbl'>🕐 Hora cierre</div><div class='val'>${hora}</div></div>
</div>

<!-- ═══════════ LECTURAS DE MANGUERA ═══════════ -->
<div class='card'>
  <div class='section-title'>📋 LECTURAS DE MANGUERA</div>
  ${productosVisibles.length > 0 ? `<table>
    <thead><tr>
      <th>Producto</th>
      <th style='text-align:right'>Lectura Anterior</th>
      <th style='text-align:right'>Lectura Actual</th>
      <th style='text-align:right'>Galones Desp.</th>
    </tr></thead>
    <tbody>${productRowsA4}</tbody>
  </table>` : '<div style="color:#999;font-size:10px;padding:6px 8px;background:#f9f9f6;border-radius:4px">No se registraron lecturas de manguera</div>'}
</div>

<!-- ═══════════ VENTAS VIRTUALES + VARILLADO/GASTOS ═══════════ -->
<div class='two-col'>
  <div class='card'>
    <div class='section-title'>💳 VENTAS VIRTUALES</div>
    ${ventasVirtuales.length > 0 ? `<table>
      <thead><tr><th>Producto</th><th style='text-align:center'>Método</th><th style='text-align:right'>Cant.</th><th style='text-align:right'>Total</th></tr></thead>
      <tbody>${virtualRowsA4}
      <tr class='tr'><td colspan='3' style='text-align:right;font-size:9px;color:#888'>TOTAL VENTAS VIRTUALES</td><td style='text-align:right;color:#2E75B6;font-size:11px'>S/ ${totalVentasVirtuales.toFixed(2)}</td></tr>
      </tbody>
    </table>` : '<div style="color:#999;font-size:10px;padding:8px;text-align:center">Sin ventas virtuales registradas</div>'}
  </div>
  <div class='card'>
    ${varilladoRowsA4 ? `<div class='section-title'>📏 VARILLADO</div><table><thead><tr><th>Tanque / Producto</th><th style='text-align:right'>Medición (cm)</th></tr></thead><tbody>${varilladoRowsA4}</tbody></table>` : '<div style="margin-bottom:8px"></div>'}
    ${gastosRowsA4 ? `<div class='section-title'>💰 GASTOS</div><table><thead><tr><th>Concepto</th><th style='text-align:right'>Monto</th></tr></thead><tbody>${gastosRowsA4}<tr class='tr'><td style='text-align:right;font-size:9px;color:#888'>TOTAL GASTOS</td><td style='text-align:right;color:#C0392B;font-size:11px'>- S/ ${totalGastos.toFixed(2)}</td></tr></tbody></table>` : ''}
  </div>
</div>

<!-- ═══════════ RESUMEN DE CAJA ═══════════ -->
<div class='box-section'>
  <div class='title'>💵 RESUMEN DE CAJA — Efectivo del Turno</div>
  <div class='box-grid'>
    <div class='box-card'>
      <div class='lbl'>Ventas por Mangueras</div>
      <div class='val' style='color:#C4841D'>S/ ${totalMangueras.toFixed(2)}</div>
    </div>
    <div class='box-card'>
      <div class='lbl'>(-) Ventas Virtuales</div>
      <div class='val' style='color:#2E75B6'>S/ ${totalVentasVirtuales.toFixed(2)}</div>
    </div>
    <div class='box-card'>
      <div class='lbl'>(-) Gastos del Turno</div>
      <div class='val' style='color:#C0392B'>S/ ${totalGastos.toFixed(2)}</div>
    </div>
  </div>
  <div class='box-final'>
    <div class='lbl'>EFECTIVO QUE DEBE ENTREGAR EL TRABAJADOR</div>
    <div class='big'>S/ ${efectivoFijo.toFixed(2)}</div>
  </div>
</div>

<!-- ═══════════ FIRMAS ═══════════ -->
<div style='display:grid;grid-template-columns:1fr 60px 1fr;gap:0;margin-top:30px;padding-top:10px'>
  <div style='text-align:center'>
    <div style='border-top:1.5px solid #ccc;margin:0 20px;padding-top:6px;font-size:10px;color:#888;font-weight:600'>Firma del Trabajador</div>
    <div style='margin-top:4px;font-size:9px;color:#aaa'>DNI: ${trabajador ? trabajador.dni || '---' : '---'}</div>
  </div>
  <div></div>
  <div style='text-align:center'>
    <div style='border-top:1.5px solid #ccc;margin:0 20px;padding-top:6px;font-size:10px;color:#888;font-weight:600'>Firma del Supervisor</div>
    <div style='margin-top:4px;font-size:9px;color:#aaa'>V°B° _______________</div>
  </div>
</div>

<div class='footer'>Grifos Kala S.A.C. — RUC: ${EMPRESA.ruc} — Generado el ${fecha} a las ${hora}</div>
</body></html>`);
        } else {
          // ============ TÉRMICA 58mm/80mm — REPORTE DE CIERRE DE TURNO ============
          const paperW = is80mm ? '74mm' : '52mm';
          const paperPage = is80mm ? '80mm auto' : '58mm auto';
          const padSide = is80mm ? '5mm' : '3mm';
          const hdrSize = is80mm ? '18px' : '14px';
          const fontSize = is80mm ? '11px' : '10px';
          const rowFontSize = is80mm ? '11px' : '9px';
          const sepWidth = is80mm ? '2px' : '1.5px';
          const bigSize = is80mm ? '22px' : '18px';
          w.document.write(`
<!DOCTYPE html>
<html><head><meta charset='utf-8'><title>Cierre de Turno - ${nom}</title>
<style>
  @page { size: ${paperPage}; margin: ${padSide}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Consolas', 'Courier New', 'Lucida Console', monospace; padding: ${padSide}; width: ${paperW}; font-size: ${fontSize}; font-weight: 700; color: #000; background: #fff; line-height: 1.5; -webkit-print-color-adjust: exact; print-color-adjust: exact; letter-spacing: 0.2px; }
  .c { text-align: center; }
  .b { font-weight: 900; }
  .sep { border-top: ${sepWidth} dashed #000; margin: 2.5mm 0; }
  .sep2 { border-top: 2.5px solid #000; margin: 2.5mm 0; }
  .sep3 { border-top: 1px solid #666; margin: 2mm 0; }
  .row { display: flex; justify-content: space-between; }
  .section { font-size: ${rowFontSize}; font-weight: 900; letter-spacing: 1px; color: #000; margin: 3mm 0 1.5mm; text-transform: uppercase; }
  .section::after { content: ''; display: block; border-bottom: ${sepWidth} solid #000; margin-top: 1mm; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 2.5mm; font-size: ${rowFontSize}; font-weight: 700; }
  th { text-align: left; font-weight: 900; border-bottom: ${sepWidth} solid #000; padding: 1.5mm 0; font-size: ${is80mm ? '9px' : '8px'}; letter-spacing: 0.5px; color: #000; text-transform: uppercase; }
  td { padding: 1.5mm 0; border-bottom: 1px dotted #999; }
  .total-row td { border-top: ${sepWidth} solid #000; border-bottom: ${sepWidth} solid #000; padding: 2mm 0; font-weight: 900; }
  .summary-box { border: 2.5px solid #000; padding: 2.5mm 3mm; margin: 2.5mm 0; background: #f5f5f5; }
  .big { font-size: ${bigSize}; font-weight: 900; }
  .small { font-size: ${is80mm ? '9px' : '8px'}; color: #333; font-weight: 600; }
  .cut { border-top: 2.5px dashed #000; margin-top: 4mm; padding-top: 3mm; text-align: center; font-size: ${rowFontSize}; color: #666; font-weight: 600; }
  @media print { body { padding: ${padSide}; width: ${paperW}; } }
</style></head><body>

<!-- ═══ ENCABEZADO ═══ -->
<div class='c'>
  <div style='font-size:${hdrSize};font-weight:900;letter-spacing:2px'>⛽ GRIFOS KALA</div>
  <div style='font-size:${is80mm ? '11px' : '9px'};font-weight:700;margin-top:1.5mm;color:#222'>CIERRE DE TURNO</div>
</div>

<div class='sep2'></div>

<!-- ═══ DATOS DEL TURNO ═══ -->  <div style='font-size:${rowFontSize};font-weight:700;line-height:1.8'>
  <div class='row'><span style='color:#333'>Fecha:</span><span class='b'>${fecha}</span></div>
  <div class='row'><span style='color:#333'>Trabajador:</span><span class='b'>${nom}</span></div>
  <div class='row'><span style='color:#333'>Estación:</span><span class='b'>${estacion}</span></div>
  <div class='row'><span style='color:#333'>Hora:</span><span class='b'>${hora}</span></div>
</div>

<div class='sep2'></div>

<!-- ═══ LECTURAS DE MANGUERA ═══ -->
<div class='section'>📋 Lecturas de Manguera</div>
${productosVisibles.length > 0 ? `<table>
  <thead><tr><th>Prod.</th><th style='text-align:right'>Ant.</th><th style='text-align:right'>Act.</th><th style='text-align:right'>Galones</th></tr></thead>
  <tbody>${productRows}</tbody>
</table>` : '<div class="small">Sin lecturas registradas</div>'}

<div class='sep'></div>

<!-- ═══ VENTAS VIRTUALES ═══ -->
<div class='section'>💳 Ventas Virtuales</div>
${ventasVirtuales.length > 0 ? `<table>
  <thead><tr><th>Producto</th><th style='text-align:right'>Cant</th><th style='text-align:right'>Total</th></tr></thead>
  <tbody>${virtualRows}
  <tr class='total-row'><td colspan='2' style='text-align:right;font-size:9px;color:#555'>TOTAL</td><td style='text-align:right'>S/ ${totalVentasVirtuales.toFixed(2)}</td></tr>
  </tbody>
</table>` : '<div class="small">Sin ventas virtuales</div>'}

${varilladoRows ? `<div class='sep'></div><div class='section'>📏 Varillado</div><table><thead><tr><th>Tanque</th><th style='text-align:right'>cm</th></tr></thead><tbody>${varilladoRows}</tbody></table>` : ''}

${gastosRows ? `<div class='sep'></div><div class='section'>💰 Gastos del Turno</div><table><thead><tr><th>Concepto</th><th style='text-align:right'>Monto</th></tr></thead><tbody>${gastosRows}<tr class='total-row'><td style='text-align:right;font-size:9px;color:#555'>TOTAL GASTOS</td><td style='text-align:right'>- S/ ${totalGastos.toFixed(2)}</td></tr></tbody></table>` : ''}

<!-- ═══ RESUMEN DE CAJA ═══ -->
<div class='sep2'></div>
<div class='c b' style='font-size:10px;letter-spacing:1.5px'>💵 RESUMEN DE CAJA</div>
<div class='sep'></div>
<div style='font-size:9px;font-weight:700;line-height:2'>
  <div class='row'><span style='color:#333'>Mangueras:</span><span class='b'>S/ ${totalMangueras.toFixed(2)}</span></div>
  <div class='row'><span style='color:#333'>(-) Virtuales:</span><span class='b'>- S/ ${totalVentasVirtuales.toFixed(2)}</span></div>
  <div class='row'><span style='color:#333'>(-) Gastos:</span><span class='b'>- S/ ${totalGastos.toFixed(2)}</span></div>
</div>

<div class='sep2'></div>
<div class='summary-box'>
  <div class='c'>
    <div class='small' style='margin-bottom:1.5mm'>ENTREGAR</div>
    <div class='big'>S/ ${efectivoFijo.toFixed(2)}</div>
  </div>
</div>

<div class='sep3'></div>

<!-- ═══ FIRMAS ═══ -->
<div style='margin-top:3mm'>
  <div class='row small' style='margin-bottom:6mm'>
    <span>________________________</span>
    <span style='margin:0 4mm'></span>
    <span>________________________</span>
  </div>
  <div class='row small' style='font-size:8px;color:#888'>
    <span>Firma Trabajador</span>
    <span style='margin:0 4mm'></span>
    <span>Firma Supervisor</span>
  </div>
</div>

<div class='sep3'></div>
<div class='c small' style='font-weight:500'>Grifos Kala S.A.C. · RUC: ${EMPRESA.ruc}</div>
<div class='c small' style='font-weight:500'>${fecha} ${hora}</div>
<div class='cut'>- - - - - - - - - - - - - - - - - - - -</div>
</body></html>`);
        }
        w.document.close();
        setTimeout(() => { w.print(); }, 600);
      }

      return (<div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

        {/* ===== HEADER: FECHA + TRABAJADOR ===== */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: '16px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 36, height: 36, borderRadius: 10, background: C.amberSoft, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <WI.Receipt size={18} color={C.amber} />
            </div>
            <div>
              <div style={{ fontFamily: 'Oswald', fontSize: 16, fontWeight: 700, color: C.text, textTransform: 'uppercase', letterSpacing: '0.03em' }}>CIERRE DE TURNO</div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Genera el reporte de cierre de tu turno</div>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 14, color: C.amber, fontWeight: 600, background: C.amberSoft, padding: '6px 14px', borderRadius: 8, border: `1px solid ${C.amber}33` }}>{fechaInicio}</div>
            <div style={{ fontFamily: 'Inter', fontSize: 13, color: C.textDim, fontWeight: 600 }}>{nombreTrabajador}</div>
          </div>
        </div>

        {/* ===== SELECCIÓN DE MÁQUINAS ===== */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 12 }}>⛽ Selecciona las máquinas que usaste</div>
          {maquinasDisponibles.length === 0 ? (
            <div style={{ padding: 16, background: C.bg, borderRadius: 10, textAlign: 'center', border: `1px dashed ${C.border}` }}>
              <div style={{ fontFamily: 'Inter', fontSize: 13, color: C.muted }}>No tienes máquinas asignadas</div>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              {maquinasDisponibles.map(m => {
                const sel = maquinasSeleccionadas.includes(m.id);
                return (
                  <button key={m.id} onClick={() => toggleMaquinaSeleccionada(m.id)} type="button" style={{
                    display: 'flex', alignItems: 'center', gap: 10,
                    padding: '10px 16px', borderRadius: 10,
                    border: `2px solid ${sel ? C.amber : C.border}`,
                    background: sel ? C.amberSoft : C.bg,
                    cursor: 'pointer', transition: 'all 0.15s',
                  }}>
                    <div style={{ width: 10, height: 10, borderRadius: '50%', background: sel ? C.amber : C.green }} />
                    <div>
                      <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: sel ? C.amber : C.text }}>{m.nombre}</div>
                      <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted }}>{m.isla}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* ===== LECTURAS DE MANGUERA ===== */}
        {maquinasSeleccionadas.length === 0 ? (
          <div style={{ background: C.panel, border: `1px dashed ${C.border}`, borderRadius: 14, padding: 30, textAlign: 'center' }}>
            <div style={{ fontSize: 32, marginBottom: 8 }}>⛽</div>
            <div style={{ fontFamily: 'Inter', fontSize: 14, color: C.muted, fontWeight: 600 }}>Selecciona las máquinas que usaste en tu turno</div>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, marginTop: 4 }}>Las lecturas de manguera aparecerán aquí</div>
          </div>
        ) : (
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20 }}>
            <div style={{ fontFamily: 'Inter', fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 16 }}>📋 LECTURAS DE MANGUERA</div>
            {productosVisibles.map(p => {
              const galones = calcularGalones(p.id);
              const monto = calcularMontoProducto(p.id);
              return (
                <div key={p.id} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 8, height: 8, borderRadius: '50%', background: p.color }} />
                      <span style={{ fontFamily: 'Oswald', fontSize: 14, fontWeight: 600, color: p.color, textTransform: 'uppercase' }}>{p.nombre}</span>
                    </div>
                    <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.muted }}>S/ {p.precio.toFixed(2)} / {p.unidad}</span>
                  </div>
                  {/* Header */}
                  <div style={{ display: 'grid', gridTemplateColumns: '30px 1fr 1fr 80px', gap: 6, marginBottom: 6 }}>
                    <div />
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, textAlign: 'center', fontWeight: 600 }}>Anterior</div>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, textAlign: 'center', fontWeight: 600 }}>Actual</div>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, textAlign: 'right', fontWeight: 600 }}>Galones</div>
                  </div>
                  {(lecturas[p.id] || []).map((r, idx) => {
                    const ant = parseFloat(r.anterior) || 0;
                    const act = parseFloat(r.actual) || 0;
                    const gal = Math.max(0, act - ant);
                    return (
                      <div key={r.id} style={{ display: 'grid', gridTemplateColumns: '30px 1fr 1fr 80px', gap: 6, marginBottom: 6, alignItems: 'center' }}>
                        <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.textDim, textAlign: 'center', fontWeight: 600 }}>{idx + 1}</div>
                        <input type="number" step="0.001" min="0" placeholder="0.000" value={r.anterior} onChange={e => setLectura(p.id, idx, 'anterior', e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '8px 8px', color: C.text, fontFamily: 'JetBrains Mono', fontSize: 13, textAlign: 'center', boxSizing: 'border-box' }} />
                        <input type="number" step="0.001" min="0" placeholder="0.000" value={r.actual} onChange={e => setLectura(p.id, idx, 'actual', e.target.value)} style={{ width: '100%', background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: '8px 8px', color: C.text, fontFamily: 'JetBrains Mono', fontSize: 13, textAlign: 'center', boxSizing: 'border-box' }} />
                        <div style={{ textAlign: 'right' }}><span style={{ fontFamily: 'JetBrains Mono', fontSize: 14, fontWeight: 700, color: gal > 0 ? p.color : C.muted }}>{gal > 0 ? gal.toFixed(2) : '0.00'}</span></div>
                      </div>
                    );
                  })}
                  <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 10, paddingTop: 10, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Total {p.nombre.toLowerCase()}: <b style={{ color: C.text }}>{galones.toFixed(2)} {p.unidad}</b></span>
