    /* ===================== TABLAS DE CALIBRACIÓN ===================== */
    function generarTablaCalibracion(longitud, diametro, capacidadMax, maxCm) {
      const tabla = [];
      const R = diametro / 2;
      for (let cm = 0; cm <= maxCm; cm++) {
        if (cm === 0) { tabla.push(0); continue; }
        if (cm >= maxCm) { tabla.push(capacidadMax); continue; }
        const h = cm / 100;
        if (h >= diametro) { tabla.push(capacidadMax); continue; }
        const acosArg = Math.max(-1, Math.min(1, (R - h) / R));
        const sqrtArg = Math.max(0, 2 * R * h - h * h);
        const area = R * R * Math.acos(acosArg) - (R - h) * Math.sqrt(sqrtArg);
        tabla.push(Math.round(longitud * area * 264.172 * 100) / 100);
      }
      return tabla;
    }
    function interpolarTabla(cm, tabla) {
      if (cm <= 0) return 0;
      if (cm >= tabla.length - 1) return tabla[tabla.length - 1];
      const idx = Math.floor(cm);
      const frac = cm - idx;
      if (frac === 0 || idx >= tabla.length - 1) return tabla[Math.min(idx, tabla.length - 1)];
      return tabla[idx] + frac * (tabla[idx + 1] - tabla[idx]);
    }
    function buscarCmEnTabla(galones, tabla) {
      if (galones <= 0) return 0;
      if (galones >= tabla[tabla.length - 1]) return tabla.length - 1;
      let lo = 0, hi = tabla.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (tabla[mid] <= galones) lo = mid; else hi = mid; }
      if (tabla[hi] === tabla[lo]) return lo;
      return lo + (galones - tabla[lo]) / (tabla[hi] - tabla[lo]);
    }

    /* ===================== LOGIN ===================== */
    function LoginScreen({ onLogin }) {
      const [rol, setRol] = useState('trabajador');
      const [usuario, setUsuario] = useState('');
      const [clave, setClave] = useState('');
      const [verClave, setVerClave] = useState(false);
      const [error, setError] = useState('');
      function submit() { if (!usuario.trim() || !clave.trim()) { setError('Ingresa tu usuario y contraseña.'); return; } setError(''); onLogin(rol, usuario.trim()); }
      function onKeyDownField(e) { if (e.key === 'Enter') submit(); }
      return (<div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.bg, padding: 20 }}>
        <div style={{ width: '100%', maxWidth: 380 }}>
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 26 }}><Logo /></div>
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24 }}>
            <div style={{ display: 'flex', background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: 3, marginBottom: 20 }}>
              {['trabajador', 'admin'].map(r => (<button key={r} type="button" onClick={() => setRol(r)} style={{ flex: 1, padding: '9px 0', borderRadius: 8, border: 'none', background: rol === r ? C.amber : 'transparent', color: rol === r ? C.bg : C.textDim, fontFamily: 'Inter', fontWeight: 600, fontSize: 13, cursor: 'pointer' }}>{r === 'trabajador' ? 'Trabajador' : 'Administrador'}</button>))}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <Field label="Usuario"><input style={getInputStyle()} placeholder="ej. mcondori" value={usuario} onChange={e => setUsuario(e.target.value)} onKeyDown={onKeyDownField} /></Field>
              <Field label="Contraseña"><div style={{ position: 'relative' }}>
                <input style={{ ...getInputStyle(), paddingRight: 38 }} type={verClave ? 'text' : 'password'} placeholder="••••••••" value={clave} onChange={e => setClave(e.target.value)} onKeyDown={onKeyDownField} />
                <button type="button" onClick={() => setVerClave(v => !v)} style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: C.muted, padding: 4 }}>{verClave ? <I.EyeOff size={16} /> : <I.Eye size={16} />}</button>
              </div></Field>
              {error && <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: C.red, fontFamily: 'Inter', fontSize: 12.5 }}><I.AlertTriangle size={14} /> {error}</div>}
              <button type="button" onClick={submit} style={{ marginTop: 4, background: C.amber, color: C.bg, border: 'none', borderRadius: 9, padding: '11px 0', fontFamily: 'Inter', fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>Ingresar</button>
            </div>
          </div>
        </div>
      </div>);
    }

    /* ===================== ADMIN: CONTROL DE TANQUES ===================== */
    function ControlTanquesAdmin({ estacion }) {
      const isMobile = useIsMobile();
      const [showReposicion, setShowReposicion] = useState(false);
      const [tanques, setTanques] = useState({
        regular: { nombre: 'Regular', capacidad: 1947.02, nivelCm: 80, alturaTotalCm: 228, unidad: 'gal', color: C.teal, soft: C.tealSoft, icono: I.Gauge, provisorio: 'Repsol', consumoDiario: 350, ultimoAbastecimiento: '22/08/2026', costoUnitario: 15.20, longitud: 1.81, diametro: 2.28 },
        diesel1: { nombre: 'D2#1', capacidad: 3927.39, nivelCm: 160, alturaTotalCm: 228, unidad: 'gal', color: C.amber, soft: C.amberSoft, icono: I.Fuel, provisorio: 'PetroPerú', consumoDiario: 650, ultimoAbastecimiento: '22/08/2026', costoUnitario: 18.50, longitud: 3.63, diametro: 2.29 },
        diesel3: { nombre: 'D2#3', capacidad: 1947.02, nivelCm: 120, alturaTotalCm: 228, unidad: 'gal', color: C.amber, soft: C.amberSoft, icono: I.Fuel, provisorio: 'PetroPerú', consumoDiario: 350, ultimoAbastecimiento: '20/08/2026', costoUnitario: 18.50, longitud: 1.81, diametro: 2.28 },
        diesel4: { nombre: 'D2#4', capacidad: 5287, nivelCm: 160, alturaTotalCm: 229, unidad: 'gal', color: C.amber, soft: C.amberSoft, icono: I.Fuel, provisorio: 'PetroPerú', consumoDiario: 900, ultimoAbastecimiento: '22/08/2026', costoUnitario: 18.50, longitud: 4.86, diametro: 2.29 },
        urea: { nombre: 'Urea', capacidad: 2000, nivelCm: 700, alturaTotalCm: 1400, unidad: 'litros', color: C.green, soft: C.greenSoft, icono: I.Droplet, provisorio: 'InkaFertil', consumoDiario: 50, ultimoAbastecimiento: '18/08/2026', costoUnitario: 1.80, longitud: 0, diametro: 0 },
      });
      function cmAGalones(cm, tanqueId) {
        const tanque = tanques[tanqueId]; if (!tanque) return 0;
        if (cm <= 0) return 0;
        if (tanque.unidad === 'litros') return Math.round((cm / tanque.alturaTotalCm) * tanque.capacidad);
        if (cm >= tanque.alturaTotalCm) return Math.round(tanque.capacidad);
        const tabla = TABLAS_PRE[tanqueId]; if (!tabla) return 0;
        return Math.round(interpolarTabla(cm, tabla) * 10) / 10;
      }
      function galonesACm(galones, tanqueId) {
        const tanque = tanques[tanqueId]; if (!tanque) return 0;

    /* ===================== CALENDARIO ANUAL POR TRABAJADOR ===================== */
    function CalendarioAnual({ horario, year, diasOverrides, onDayClick }) {
      const isMobile = useIsMobile(768);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const dayNames = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
      const today = new Date();

      function getDayKey(year, month, day) {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      function isWorkingDay(year, month, day) {
        const key = getDayKey(year, month, day);
        if (diasOverrides && key in diasOverrides) return !diasOverrides[key];
        const dow = (new Date(year, month, day).getDay() + 6) % 7;
        const h = horario.find(x => x.dia === DIAS[dow]);
        return h && !h.libre;
      }

      const totalDiasTrabajo = (() => {
        let c = 0;
        for (let m = 0; m < 12; m++) {
          const dim = new Date(year, m + 1, 0).getDate();
          for (let d = 1; d <= dim; d++) {
            if (isWorkingDay(year, m, d)) c++;
          }
        }
        return c;
      })();

      return (<div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 10 }}>
          <div style={{ display: 'flex', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}><div style={{ width: 12, height: 12, borderRadius: 3, background: '#22C55E', boxShadow: '0 0 6px #22C55E66' }} /><span style={{ fontFamily: 'Inter', fontSize: 10.5, color: C.textDim, fontWeight: 500 }}>Trabaja</span></div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}><div style={{ width: 12, height: 12, borderRadius: 3, background: '#EF4444', boxShadow: '0 0 6px #EF444466' }} /><span style={{ fontFamily: 'Inter', fontSize: 10.5, color: C.textDim, fontWeight: 500 }}>Descansa</span></div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}><div style={{ width: 12, height: 12, borderRadius: 3, background: 'transparent', border: `2px solid ${C.amber}`, boxShadow: '0 0 6px #E8A33D66' }} /><span style={{ fontFamily: 'Inter', fontSize: 10.5, color: C.textDim, fontWeight: 500 }}>Hoy</span></div>

          </div>
          <span style={{ fontFamily: 'Inter', fontSize: 10.5, color: C.muted }}>{totalDiasTrabajo} días de trabajo estimados en {year}</span>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(190px, 1fr))', gap: 10 }}>
          {monthNames.map((mn, monthIdx) => {
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            const firstDay = (new Date(year, monthIdx, 1).getDay() + 6) % 7;
            const cells = [];
            for (let i = 0; i < firstDay; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);
            return (<div key={mn} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 10 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 11, fontWeight: 700, color: C.text, marginBottom: 6, textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.03em' }}>{mn}</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, marginBottom: 3 }}>
                {dayNames.map((dn, i) => <div key={i} style={{ textAlign: 'center', fontFamily: 'Inter', fontSize: 8, color: C.muted, fontWeight: 600 }}>{dn}</div>)}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 3 }}>
                {cells.map((d, idx) => {
                  if (d === null) return <div key={'e' + idx} />;
                  const dateObj = new Date(year, monthIdx, d);
                  const key = getDayKey(year, monthIdx, d);
                  const trabaja = isWorkingDay(year, monthIdx, d);
                  const isToday = dateObj.toDateString() === today.toDateString();
                  return (
                    <div
                      key={d}
                      onClick={() => onDayClick && onDayClick(key, trabaja)}
                      title={`${d} de ${mn} — ${trabaja ? 'Trabaja' : 'Descansa'} — Click para cambiar`}
                      style={{
                        aspectRatio: '1',
                        borderRadius: 4,
                        background: trabaja ? '#22C55E' : '#EF4444',
                        border: isToday ? `2.5px solid ${C.amber}` : 'none',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        cursor: onDayClick ? 'pointer' : 'default',
                        transition: 'all 0.15s ease',
                        boxShadow: trabaja ? '0 1px 4px #22C55E44' : '0 1px 4px #EF444444',
                      }}
                    >
                      <span style={{
                        fontFamily: 'JetBrains Mono',
                        fontSize: 7,
                        color: '#fff',
                        fontWeight: 700,
                        textShadow: '0 1px 2px rgba(0,0,0,0.3)',
                      }}>{d}</span>
                    </div>
                  );
                })}
              </div>
            </div>);
          })}
        </div>
      </div>);
    }

    /* ===================== ADMIN: TRABAJADORES ===================== */
    function TrabajadoresAdmin() {
      const isMobile = useIsMobile(768);
      const [trabajadores, setTrabajadores] = useState(() => {
        try {
          const saved = localStorage.getItem('grifos_kala_trabajadores');
          return saved ? JSON.parse(saved) : TRABAJADORES_INIT;
        } catch { return TRABAJADORES_INIT; }
      });
      const [maquinas, setMaquinas] = useState(() => {
        try {
          const saved = localStorage.getItem('grifos_kala_maquinas');
          return saved ? JSON.parse(saved) : MAQUINAS_INIT;
        } catch { return MAQUINAS_INIT; }
      });

      useEffect(() => {
        localStorage.setItem('grifos_kala_trabajadores', JSON.stringify(trabajadores));
      }, [trabajadores]);
      useEffect(() => {
        localStorage.setItem('grifos_kala_maquinas', JSON.stringify(maquinas));
      }, [maquinas]);
      const [showModal, setShowModal] = useState(false);
      const [editando, setEditando] = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      const [calendarioAbiertoId, setCalendarioAbiertoId] = useState(null);
      const anioActual = new Date().getFullYear();
      const [vista, setVista] = useState('lista');
      const [filtroEstacion, setFiltroEstacion] = useState('todas');
      const [showMaquinasModal, setShowMaquinasModal] = useState(false);
      const [diasOverrides, setDiasOverrides] = useState(() => {
        const init = {};
        TRABAJADORES_INIT.forEach(t => { if (t.diasOverrides) init[t.id] = t.diasOverrides; });
        return init;
      });

      function toggleDia(trabajadorId, key, trabajaActual) {
        setDiasOverrides(prev => {
          const worker = prev[trabajadorId] || {};
          const actual = worker[key];
          let nuevo;
          if (actual === undefined) {
            nuevo = trabajaActual ? true : false;
          } else {
            nuevo = !actual;
          }
          const newWorker = { ...worker };
          if (nuevo === undefined || nuevo === null) {
            delete newWorker[key];
          } else {
            newWorker[key] = nuevo;
          }
          if (Object.keys(newWorker).length === 0) {
            const result = { ...prev };
            delete result[trabajadorId];
            return result;
          }
          return { ...prev, [trabajadorId]: newWorker };
        });
      }

      function guardarOverrides(trabajadorId) {
        setTrabajadores(prev => prev.map(t => {
          if (t.id !== trabajadorId) return t;
          return { ...t, diasOverrides: diasOverrides[trabajadorId] || {} };
        }));
      }

      // Form state
      const [fNombre, setFNombre] = useState('');
      const [fDni, setFDni] = useState('');
      const [fUsuario, setFUsuario] = useState('');
      const [fEstacion, setFEstacion] = useState(ESTACIONES[0]);
      const [fHorario, setFHorario] = useState(() => DIAS.map(d => ({ dia: d, libre: true, ini: '06:00', fin: '14:00' })));
      const [fMaquinas, setFMaquinas] = useState([]);

      // Machine form
      const [mNombre, setMNombre] = useState('');
      const [mIsla, setMIsla] = useState('');
      const [mMangueros, setMMangueros] = useState(4);
      const [mEstacion, setMEstacion] = useState(ESTACIONES[0]);

      function abrirCrear() {
        setEditando(null);
        setFNombre(''); setFDni(''); setFUsuario('');
        setFEstacion(ESTACIONES[0]);
        setFHorario(DIAS.map(d => ({ dia: d, libre: true, ini: '06:00', fin: '14:00' })));
        setFMaquinas([]);
        setShowModal(true);
      }
      function abrirEditar(t) {
        setEditando(t.id);
        setFNombre(t.nombre); setFDni(t.dni); setFUsuario(t.usuario);
        setFEstacion(t.estacion);
        setFHorario(t.horario.map(h => ({ ...h })));
        setFMaquinas(t.maquinasAsignadas || []);
        setShowModal(true);
      }
      const [errorModal, setErrorModal] = useState('');

      function guardarTrabajador() {
        setErrorModal('');
        if (!fNombre.trim()) { setErrorModal('Ingresa el nombre completo.'); return; }
        if (!fDni.trim() || fDni.trim().length !== 8) { setErrorModal('El DNI debe tener 8 dígitos.'); return; }
        if (!fUsuario.trim()) { setErrorModal('Ingresa un usuario.'); return; }
        const usuarioExiste = trabajadores.find(t => t.usuario === fUsuario.trim() && t.id !== editando);
        if (usuarioExiste) { setErrorModal('Este usuario ya existe: ' + usuarioExiste.nombre); return; }
        const dniExiste = trabajadores.find(t => t.dni === fDni.trim() && t.id !== editando);
        if (dniExiste) { setErrorModal('Este DNI ya está registrado: ' + dniExiste.nombre); return; }
        if (editando) {
          setTrabajadores(prev => prev.map(t => {
            if (t.id !== editando) return t;
            return { ...t, nombre: fNombre.trim(), dni: fDni.trim(), usuario: fUsuario.trim(), estacion: fEstacion, horario: fHorario, maquinasAsignadas: fMaquinas };
          }));
        } else {
          const nuevoId = trabajadores.length > 0 ? Math.max(...trabajadores.map(t => t.id)) + 1 : 1;
          setTrabajadores(prev => [...prev, { id: nuevoId, nombre: fNombre.trim(), dni: fDni.trim(), usuario: fUsuario.trim(), estacion: fEstacion, horario: fHorario, maquinasAsignadas: fMaquinas }]);
        }
        setShowModal(false);
      }
      function eliminarTrabajador(id) {
        setTrabajadores(prev => prev.filter(t => t.id !== id));
      }
      function toggleDiaLibre(idx) {
        setFHorario(prev => prev.map((h, i) => i === idx ? { ...h, libre: !h.libre } : h));
      }
      function setHorarioDia(idx, campo, valor) {
        setFHorario(prev => prev.map((h, i) => i === idx ? { ...h, [campo]: valor } : h));
      }
      function toggleMaquina(mId) {
        setFMaquinas(prev => prev.includes(mId) ? prev.filter(x => x !== mId) : [...prev, mId]);
      }
      function agregarMaquina() {
        if (!mNombre.trim() || !mIsla.trim()) return;
        const nuevoId = 'm' + (maquinas.length + 1);
        setMaquinas(prev => [...prev, { id: nuevoId, nombre: mNombre.trim(), isla: mIsla.trim(), mangueros: mMangueros, estado: 'Activa', estacion: mEstacion }]);
        setMNombre(''); setMIsla(''); setMMangueros(4);
        setShowMaquinasModal(false);
      }
      function eliminarMaquina(id) {
        setMaquinas(prev => prev.filter(m => m.id !== id));
        setTrabajadores(prev => prev.map(t => ({ ...t, maquinasAsignadas: (t.maquinasAsignadas || []).filter(x => x !== id) })));
      }

      const trabajadoresFiltrados = filtroEstacion === 'todas' ? trabajadores : trabajadores.filter(t => t.estacion === filtroEstacion);
      const maquinasEstacion = maquinas.filter(m => m.estacion === fEstacion);

      return (<div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ display: 'flex', gap: 4 }}>
              <button onClick={() => setVista('lista')} type="button" style={{ padding: '7px 14px', borderRadius: 8, border: `1px solid ${vista === 'lista' ? C.amber : C.border}`, background: vista === 'lista' ? C.amberSoft : C.panel, color: vista === 'lista' ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}>📋 Lista</button>
              <button onClick={() => setVista('horarios')} type="button" style={{ padding: '7px 14px', borderRadius: 8, border: `1px solid ${vista === 'horarios' ? C.amber : C.border}`, background: vista === 'horarios' ? C.amberSoft : C.panel, color: vista === 'horarios' ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}>📅 Horarios</button>
              <button onClick={() => setVista('maquinas')} type="button" style={{ padding: '7px 14px', borderRadius: 8, border: `1px solid ${vista === 'maquinas' ? C.amber : C.border}`, background: vista === 'maquinas' ? C.amberSoft : C.panel, color: vista === 'maquinas' ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}>⛽ Máquinas</button>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {[{ id: 'todas', label: 'Todas' }, ...ESTACIONES.map(e => ({ id: e, label: e.split(' ').pop() }))].map(e => (
                <button key={e.id} onClick={() => setFiltroEstacion(e.id)} type="button" style={{ padding: '5px 10px', borderRadius: 6, border: `1px solid ${filtroEstacion === e.id ? C.teal : C.border}`, background: filtroEstacion === e.id ? C.tealSoft : 'transparent', color: filtroEstacion === e.id ? C.teal : C.muted, fontFamily: 'Inter', fontSize: 11, fontWeight: 500, cursor: 'pointer' }}>{e.label}</button>
              ))}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {vista !== 'maquinas' ? (
              <button onClick={abrirCrear} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.amber, color: C.bg, border: 'none', borderRadius: 8, padding: '9px 16px', fontFamily: 'Inter', fontWeight: 600, fontSize: 13, cursor: 'pointer' }}><I.Plus size={14} /> Nuevo trabajador</button>
            ) : (
              <button onClick={() => setShowMaquinasModal(true)} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.amber, color: C.bg, border: 'none', borderRadius: 8, padding: '9px 16px', fontFamily: 'Inter', fontWeight: 600, fontSize: 13, cursor: 'pointer' }}><I.Plus size={14} /> Nueva máquina</button>
            )}
          </div>
        </div>

        {/* VISTA: LISTA */}
        {vista === 'lista' && (<div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {trabajadoresFiltrados.length === 0 && <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 30, textAlign: 'center' }}><div style={{ fontSize: 28, marginBottom: 8 }}>👷</div><div style={{ fontFamily: 'Inter', fontSize: 14, color: C.textDim }}>No hay trabajadores</div></div>}
          {trabajadoresFiltrados.map(t => {
            const expand = expandedId === t.id;
            const maqAsignadas = (t.maquinasAsignadas || []).map(id => maquinas.find(m => m.id === id)).filter(Boolean);
            const horasTrabajo = t.horario.filter(h => !h.libre).length * 8;
            return (<div key={t.id} style={{ background: C.panel, border: `1px solid ${expand ? C.amber : C.border}`, borderRadius: 12, overflow: 'hidden', transition: 'border-color 0.2s' }}>
              <div onClick={() => setExpandedId(expand ? null : t.id)} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', cursor: 'pointer' }}>
                <div style={{ width: 40, height: 40, borderRadius: '50%', background: C.panelLight, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Inter', fontWeight: 600, fontSize: 13, color: C.amber, flexShrink: 0 }}>{t.nombre.split(' ').map(n => n[0]).slice(0, 2).join('')}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Inter', fontSize: 13.5, color: C.text, fontWeight: 500 }}>{t.nombre} <span style={{ color: C.muted, fontWeight: 400 }}>· DNI {t.dni}</span></div>
                  <div style={{ fontFamily: 'Inter', fontSize: 11.5, color: C.muted, marginTop: 2 }}>{t.estacion} · usuario "{t.usuario}" · {horasTrabajo}h/semana</div>
                </div>
                {maqAsignadas.length > 0 && <div style={{ display: 'flex', gap: 4 }}>{maqAsignadas.map(m => <span key={m.id} style={{ background: C.amberSoft, color: C.amber, padding: '2px 8px', borderRadius: 4, fontSize: 10, fontFamily: 'Inter', fontWeight: 500 }}>{m.nombre}</span>)}</div>}
                <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                  <button onClick={(e) => { e.stopPropagation(); abrirEditar(t); }} type="button" style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 7, padding: '5px 10px', color: C.textDim, cursor: 'pointer', fontFamily: 'Inter', fontSize: 11 }}><I.Settings size={13} /></button>
                  <button onClick={(e) => { e.stopPropagation(); eliminarTrabajador(t.id); }} type="button" style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 7, padding: '5px 10px', color: C.red, cursor: 'pointer', fontFamily: 'Inter', fontSize: 11 }}><I.Trash2 size={13} /></button>
                </div>
                <I.ChevronDown size={16} color={C.muted} style={{ transform: expand ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s', flexShrink: 0 }} />
              </div>
              {expand && (<div style={{ padding: '0 16px 16px', borderTop: `1px solid ${C.border}` }}>
                <div style={{ marginTop: 14 }}>
                  <div>
                    <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Máquinas asignadas</div>
                    {maqAsignadas.length === 0 ? <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, padding: 10, background: C.bg, borderRadius: 8, textAlign: 'center' }}>Sin máquinas asignadas</div> : (
                      <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fill, minmax(220px, 1fr))', gap: 6 }}>
                        {maqAsignadas.map(m => (
                          <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                            <div style={{ width: 8, height: 8, borderRadius: '50%', background: m.estado === 'Activa' ? C.green : C.amber, flexShrink: 0 }} />
                            <div style={{ flex: 1 }}><div style={{ fontFamily: 'Inter', fontSize: 12, color: C.text }}>{m.nombre} · {m.isla}</div><div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted }}>{m.mangueros} mangueros · {m.estado}</div></div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
                <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
                  <button onClick={(e) => { e.stopPropagation(); setCalendarioAbiertoId(calendarioAbiertoId === t.id ? null : t.id); }} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, background: calendarioAbiertoId === t.id ? C.amberSoft : C.bg, border: `1px solid ${calendarioAbiertoId === t.id ? C.amber : C.border}`, borderRadius: 8, padding: '8px 14px', color: calendarioAbiertoId === t.id ? C.amber : C.textDim, cursor: 'pointer', fontFamily: 'Inter', fontSize: 12, fontWeight: 600 }}>
                    📅 {calendarioAbiertoId === t.id ? `Ocultar calendario ${anioActual}` : `Ver calendario anual ${anioActual}`}
                    <I.ChevronDown size={13} style={{ transform: calendarioAbiertoId === t.id ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }} />
                  </button>
                  {calendarioAbiertoId === t.id && (<div style={{ marginTop: 12 }} onClick={e => e.stopPropagation()}><CalendarioAnual horario={t.horario} year={anioActual} diasOverrides={diasOverrides[t.id] || {}} onDayClick={(key, trabaja) => toggleDia(t.id, key, trabaja)} /><div style={{ marginTop: 10, display: 'flex', justifyContent: 'flex-end' }}><button onClick={(e) => { e.stopPropagation(); guardarOverrides(t.id); }} type="button" style={{ padding: '8px 18px', borderRadius: 8, background: C.amber, color: C.bg, border: 'none', fontFamily: 'Inter', fontSize: 12, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Guardar cambios</button></div></div>)}
                </div>
              </div>)}
            </div>);
          })}
        </div>)}

        {/* VISTA: HORARIOS */}
        {vista === 'horarios' && (<div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
            <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 14 }}>📅 Horario semanal por trabajador</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {trabajadoresFiltrados.map(t => {
                const initials = t.nombre.split(' ').map(n => n[0]).slice(0, 2).join('');
                return (<div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', background: C.panelLight, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Inter', fontSize: 10, color: C.amber, fontWeight: 600, flexShrink: 0 }}>{initials}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.text, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{t.nombre}</div>
                  </div>
                  <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                    {t.horario.map(h => (
                      <div key={h.dia} style={{ textAlign: 'center', padding: '4px 6px', borderRadius: 6, minWidth: 48, background: h.libre ? C.panel : C.tealSoft, border: `1px solid ${h.libre ? C.border : C.teal}33` }}>
                        <div style={{ fontFamily: 'Inter', fontSize: 8, color: C.muted, fontWeight: 600 }}>{h.dia}</div>
                        {h.libre ? <div style={{ fontFamily: 'Inter', fontSize: 7, color: C.muted, marginTop: 1 }}>Libre</div> : <div style={{ fontFamily: 'JetBrains Mono', fontSize: 8, color: C.teal, marginTop: 1 }}>{h.ini}</div>}
                      </div>
                    ))}
                  </div>
                </div>);
              })}
            </div>
          </div>

          {/* Calendario mensual */}
          {(() => {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const dayNames = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            const workerColors = [C.teal, C.amber, '#E91E63', '#6C63FF', '#FF9800', '#4CAF50'];
            const calendarDays = [];
            for (let i = 0; i < firstDay; i++) calendarDays.push(null);
            for (let d = 1; d <= daysInMonth; d++) calendarDays.push(d);
            return (<div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: C.text }}>📆 {monthNames[month]} {year}</div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}><div style={{ width: 10, height: 10, borderRadius: 3, background: C.tealSoft, border: `1px solid ${C.teal}44` }} /><span style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted }}>Trabaja</span></div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}><div style={{ width: 10, height: 10, borderRadius: 3, background: C.bg, border: `1px solid ${C.border}` }} /><span style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted }}>Descansa</span></div>
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
                {dayNames.map(d => <div key={d} style={{ textAlign: 'center', fontFamily: 'Inter', fontSize: 10, color: C.muted, fontWeight: 600, padding: '4px 0' }}>{d}</div>)}
                {calendarDays.map((day, idx) => {
                  if (day === null) return <div key={'empty_' + idx} />;
                  const dateObj = new Date(year, month, day);
                  const dayOfWeek = (dateObj.getDay() + 6) % 7;
                  const dayName = DIAS[dayOfWeek];
                  const isToday = day === now.getDate();
                  const workersWorking = trabajadoresFiltrados.filter(t => {
                    const h = t.horario.find(h => h.dia === dayName);
                    return h && !h.libre;
                  });
                  const allFree = workersWorking.length === 0;
                  return (<div key={day} style={{ textAlign: 'center', padding: '6px 2px', borderRadius: 8, minHeight: 60, background: allFree ? C.bg : `${C.teal}11`, border: `1px solid ${isToday ? C.amber : allFree ? C.border : `${C.teal}33`}`, position: 'relative' }}>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: isToday ? 700 : 500, color: isToday ? C.amber : C.text }}>{day}</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 1, marginTop: 4 }}>
                      {workersWorking.slice(0, 3).map((w, wi) => {
                        const wh = w.horario.find(h => h.dia === dayName);
                        const col = workerColors[w.id % workerColors.length];
                        return (<div key={w.id} style={{ padding: '1px 3px', borderRadius: 3, background: `${col}22`, border: `1px solid ${col}44` }}>
                          <span style={{ fontFamily: 'Inter', fontSize: 7, color: col, fontWeight: 600 }}>{w.nombre.split(' ')[0]}</span>
                        </div>);
                      })}
                      {workersWorking.length > 3 && <div style={{ fontFamily: 'Inter', fontSize: 7, color: C.muted }}>+{workersWorking.length - 3}</div>}
                    </div>
                  </div>);
                })}
              </div>
            </div>);
          })()}
        </div>)}

        {/* VISTA: MÁQUINAS */}
        {vista === 'maquinas' && (<div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          {ESTACIONES.map(est => {
            const maqEst = maquinas.filter(m => m.estacion === est);
            if (filtroEstacion !== 'todas' && !est.includes(filtroEstacion.split(' ').pop())) return null;
            return (<div key={est}>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 }}>{est}</div>
              <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fill, minmax(240px, 1fr))', gap: 10 }}>
                {maqEst.map(m => {
                  const asignados = trabajadores.filter(t => (t.maquinasAsignadas || []).includes(m.id));
                  return (<div key={m.id} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14 }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{ width: 10, height: 10, borderRadius: '50%', background: m.estado === 'Activa' ? C.green : m.estado === 'Mantenimiento' ? C.amber : C.red }} />
                        <div><div style={{ fontFamily: 'Inter', fontSize: 13, color: C.text, fontWeight: 600 }}>{m.nombre}</div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>⛽ {m.isla} · {m.mangueros} mangueros</div></div>
                      </div>
                      <button onClick={() => eliminarMaquina(m.id)} type="button" style={{ background: 'none', border: 'none', color: C.red, cursor: 'pointer', padding: 4 }}><I.Trash2 size={13} /></button>
                    </div>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, marginBottom: 6 }}>Estado: <span style={{ color: m.estado === 'Activa' ? C.green : C.amber }}>{m.estado}</span></div>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, color: C.muted, marginBottom: 6 }}>Operadores asignados:</div>
                    {asignados.length === 0 ? <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, fontStyle: 'italic' }}>Sin asignar</div> : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                        {asignados.map(t => (
                          <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px', background: C.bg, borderRadius: 6 }}>
                            <div style={{ width: 20, height: 20, borderRadius: '50%', background: C.panelLight, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Inter', fontSize: 8, color: C.amber, fontWeight: 600, flexShrink: 0 }}>{t.nombre.split(' ').map(n => n[0]).slice(0, 2).join('')}</div>
                            <span style={{ fontFamily: 'Inter', fontSize: 11, color: C.textDim }}>{t.nombre}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>);
                })}
                {maqEst.length === 0 && <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, padding: 16, textAlign: 'center' }}>No hay máquinas registradas</div>}
              </div>
            </div>);
          })}
        </div>)}

        {/* MODAL: CREAR/EDITAR TRABAJADOR */}
        {showModal && (<div onClick={() => setShowModal(false)} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, width: '100%', maxWidth: 560, maxHeight: '92vh', overflowY: 'auto', padding: 24, display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><I.Users size={18} color={C.amber} /><span style={{ fontFamily: 'Inter', fontSize: 16, fontWeight: 700, color: C.text }}>{editando ? 'Editar Trabajador' : 'Nuevo Trabajador'}</span></div>
              <button onClick={() => setShowModal(false)} type="button" style={{ background: 'none', border: 'none', color: C.muted, cursor: 'pointer' }}><I.X size={18} /></button>
            </div>
            <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Datos personales</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 4 }}>Nombre completo</div><input placeholder="Ej. Juan Pérez" value={fNombre} onChange={e => setFNombre(e.target.value)} style={getInputStyle()} /></div>
                <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 4 }}>DNI</div><input placeholder="8 dígitos" value={fDni} onChange={e => setFDni(e.target.value)} maxLength={8} style={{ ...getInputStyle(), fontFamily: 'JetBrains Mono' }} /></div>
                <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 4 }}>Usuario</div><input placeholder="Ej. jperez" value={fUsuario} onChange={e => setFUsuario(e.target.value)} style={getInputStyle()} /></div>
                <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginBottom: 4 }}>Estación</div>
                  <select value={fEstacion} onChange={e => setFEstacion(e.target.value)} style={{ ...getInputStyle(), cursor: 'pointer' }}>{ESTACIONES.map(e => <option key={e} value={e} style={{ background: C.panel }}>{e}</option>)}</select>
                </div>
              </div>
            </div>

            <div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Máquinas surtidoras ({maquinasEstacion.length} disponibles)</div>
              {maquinasEstacion.length === 0 ? <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted, padding: 12, background: C.bg, borderRadius: 8, textAlign: 'center' }}>No hay máquinas en esta estación. Crea una en la pestaña Máquinas.</div> : (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: 6 }}>
                  {maquinasEstacion.map(m => {
                    const sel = fMaquinas.includes(m.id);
                    return (<button key={m.id} onClick={() => toggleMaquina(m.id)} type="button" style={{ padding: '10px 8px', borderRadius: 8, cursor: 'pointer', textAlign: 'center', border: `1.5px solid ${sel ? C.amber : C.border}`, background: sel ? C.amberSoft : C.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                      <div style={{ width: 8, height: 8, borderRadius: '50%', background: m.estado === 'Activa' ? C.green : C.amber }} />
                      <div style={{ fontFamily: 'Inter', fontSize: 11, color: sel ? C.amber : C.textDim, fontWeight: 500 }}>{m.nombre}</div>
                      <div style={{ fontFamily: 'Inter', fontSize: 9, color: C.muted }}>{m.isla}</div>
                      {sel && <I.Check size={12} color={C.amber} />}
                    </button>);
                  })}
                </div>
              )}
            </div>

    /* ===================== WORKER: CIERRE DE TURNO ===================== */
    function WorkerCierreTurno({ ventasWorker, estacion, usuario, trabajador, maquinas: maquinasProp }) {
      const isMobile = useIsMobile();
      const [maquinasSeleccionadas, setMaquinasSeleccionadas] = useState([]);

      const maquinasDisponibles = useMemo(() => {
        if (maquinasProp && maquinasProp.length > 0) return maquinasProp;
        if (trabajador && trabajador.maquinasAsignadas && trabajador.maquinasAsignadas.length > 0) {
          return trabajador.maquinasAsignadas;
        }
        return [];
      }, [maquinasProp, trabajador]);

      function toggleMaquinaSeleccionada(mId) {
        setMaquinasSeleccionadas(prev => 
          prev.includes(mId) ? prev.filter(x => x !== mId) : [...prev, mId]
        );
      }

      const [lecturas, setLecturas] = useState(() => {
        const init = {};
        PRODUCTOS.forEach(p => {
          init[p.id] = [];
          for (let i = 1; i <= 2; i++) {
            init[p.id].push({ id: Date.now() + Math.random(), anterior: '', actual: '' });
          }
        });
        return init;
      });

      function setLectura(productoId, idx, campo, valor) {
        setLecturas(prev => ({
          ...prev,
          [productoId]: prev[productoId].map((r, i) => i === idx ? { ...r, [campo]: valor } : r)
        }));
      }

      function agregarManguera(productoId) {
        setLecturas(prev => ({
          ...prev,
          [productoId]: [...prev[productoId], { id: Date.now(), anterior: '', actual: '' }]
        }));
      }

      function eliminarManguera(productoId, idx) {
        setLecturas(prev => ({
          ...prev,
          [productoId]: prev[productoId].filter((_, i) => i !== idx)
        }));
      }

      function calcularGalones(productoId) {
        return (lecturas[productoId] || []).reduce((total, r) => {
          const ant = parseFloat(r.anterior) || 0;
          const act = parseFloat(r.actual) || 0;
          return total + Math.max(0, act - ant);
        }, 0);
      }

      function calcularMontoProducto(productoId) {
        const p = PRODUCTOS.find(pp => pp.id === productoId);
        return calcularGalones(productoId) * (p ? p.precio : 0);
      }

      const totalMangueras = PRODUCTOS.reduce((sum, p) => sum + calcularMontoProducto(p.id), 0);
      const totalGalonesMangueras = PRODUCTOS.reduce((sum, p) => sum + calcularGalones(p.id), 0);
      const totalVentas = ventasWorker.length;
      const montoTotal = ventasWorker.reduce((a, v) => a + v.total, 0);
      const efectivo = ventasWorker.filter(v => v.metodo === 'Efectivo').reduce((a, v) => a + v.total, 0);
      const otro = montoTotal - efectivo;

      return (<div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
        {/* SELECCIÓN DE MÁQUINAS */}

            </div>
            <div>
              <div style={{ fontFamily: 'Inter', fontSize: 15, fontWeight: 700, color: C.text }}>MÁQUINAS ASIGNADAS</div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: C.muted }}>Selecciona las máquinas que usaste en tu turno</div>
            </div>
          </div>
          {maquinasDisponibles.length === 0 ? (
            <div style={{ padding: 16, background: C.bg, borderRadius: 10, textAlign: 'center', border: `1px dashed ${C.border}` }}>
              <div style={{ fontSize: 24, marginBottom: 6 }}>⛽</div>
              <div style={{ fontFamily: 'Inter', fontSize: 13, color: C.muted }}>No tienes máquinas asignadas</div>
              <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginTop: 2 }}>Contacta al administrador</div>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              {maquinasDisponibles.map(m => {

                  </button>
                );
              })}
            </div>
          )}
          {maquinasSeleccionadas.length > 0 && (
            <div style={{ marginTop: 12, padding: '10px 14px', borderRadius: 8, background: C.amberSoft, border: `1px solid ${C.amber}33`, display: 'flex', alignItems: 'center', gap: 8 }}>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.amber} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

        {/* LECTURAS DE MANGUERA */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>

              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.teal} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div>
              <div style={{ fontFamily: 'Inter', fontSize: 15, fontWeight: 700, color: C.text }}>LECTURAS DE MANGUERA</div>

          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fill, minmax(380px, 1fr))', gap: 16, marginTop: 16 }}>
            {PRODUCTOS.map(p => {
              const galones = calcularGalones(p.id);
              const monto = calcularMontoProducto(p.id);
              return (
                <div key={p.id} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16 }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 8, height: 8, borderRadius: '50%', background: p.color }} />
                      <span style={{ fontFamily: 'Oswald', fontSize: 14, fontWeight: 600, color: p.color, textTransform: 'uppercase', letterSpacing: '0.03em' }}>{p.nombre}</span>
                    </div>
                    <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.muted }}>S/ {p.precio.toFixed(2)} / {p.unidad}</span>
                  </div>

      ]);

      let trabajador = (trabajadoresGlobal || []).find(t => t.usuario === usuario) || TRABAJADORES_INIT.find(t => t.usuario === usuario);
      if (!trabajador) {
        const nf = usuario.charAt(0).toUpperCase() + usuario.slice(1);

      }

      const nombreMostrar = trabajador.nombre;
      const maquinasTrabajador = useMemo(() => {
        const ids = trabajador.maquinasAsignadas || [];
        const todas = maquinasGlobal || [];
        return ids.map(id => todas.find(m => m.id === id)).filter(Boolean);
      }, [trabajador, maquinasGlobal]);
      const ventasVisibles = ventasWorker.filter(v => v.metodo !== 'Efectivo');
      const totalVentas = ventasWorker.length;
      const montoTotal = ventasWorker.reduce((a, v) => a + v.total, 0);

        setVentasWorker(prev => prev.map(v => v.id === id ? { ...v, metodo: nuevoMetodo } : v));
        setMetodoEditando(null);
      }
      const now = new Date();
      const fechaLarga = now.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
      const fechaFormateada = fechaLarga.charAt(0).toUpperCase() + fechaLarga.slice(1);

      return (<div style={{ minHeight: '100vh', background: C.bg, display: 'flex', flexDirection: 'column' }}>
        {/* ===== TOP BAR ===== */}
        <div style={{ background: C.panel, borderBottom: `1px solid ${C.border}`, padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 16 }}>
          <Logo />
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 14px', borderRadius: 8, background: C.bg, border: `1px solid ${C.border}`, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>

          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>

          </div>
          <div style={{ flex: 1 }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'Inter', fontSize: 12.5, color: C.textDim }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: C.green }} />

          </div>
          <button onClick={onToggleTheme} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', borderRadius: 8, background: C.bg, border: `1px solid ${C.border}`, color: C.textDim, fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
            <WI.Sun size={14} color={C.amber} /> {themeDark ? 'Claro' : 'Oscuro'}

        <div style={{ borderBottom: `1px solid ${C.border}`, padding: '12px 20px', display: 'flex', gap: 8 }}>

            <button key={t.id} onClick={() => setTab(t.id)} type="button" style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '9px 18px', borderRadius: 9, border: `1px solid ${tab === t.id ? C.amber : C.border}`, background: tab === t.id ? C.amberSoft : C.panel, color: tab === t.id ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>

            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, flex: 1, overflowY: 'auto' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 14 }}>Ventas recientes</div>
              {ventasVisibles.length === 0 ? (
                <div style={{ textAlign: 'center', padding: 30 }}><div style={{ fontSize: 28, marginBottom: 8 }}>🛒</div><div style={{ fontFamily: 'Inter', fontSize: 13, color: C.muted }}>Sin ventas pendientes</div><div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted, marginTop: 4 }}>Las ventas en efectivo se registran directo</div></div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {ventasVisibles.map((v) => (
                    <div key={v.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: C.bg, borderRadius: 8, border: `1px solid ${C.border}`, position: 'relative' }}>
                      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: C.muted, minWidth: 38 }}>{v.hora}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontFamily: 'Inter', fontSize: 12.5, color: C.text, fontWeight: 500 }}>{v.producto}</div>
                        <div style={{ fontFamily: 'Inter', fontSize: 11, color: C.muted }}>{v.cant}</div>
                      </div>
                      <div style={{ position: 'relative' }}>
                        <button onClick={() => setMetodoEditando(metodoEditando === v.id ? null : v.id)} type="button" style={{ padding: '3px 8px', borderRadius: 5, fontSize: 10, fontWeight: 600, border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, background: v.metodo === 'Yape' ? C.purple + '22' : C.tealSoft, color: v.metodo === 'Yape' ? C.purple : C.teal }}>
                          {v.metodo} <WI.ChevronDown size={10} />
                        </button>
                        {metodoEditando === v.id && (
                          <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: 4, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 8, padding: 4, zIndex: 50, minWidth: 120, boxShadow: `0 4px 12px ${C.bg}` }}>
                            {METODOS_WORKER.map(m => (
                              <button key={m.id} onClick={() => cambiarMetodo(v.id, m.label)} type="button" style={{ display: 'block', width: '100%', padding: '6px 10px', borderRadius: 5, border: 'none', background: v.metodo === m.label ? C.amberSoft : 'transparent', color: v.metodo === m.label ? C.amber : C.textDim, fontFamily: 'Inter', fontSize: 11, textAlign: 'left', cursor: 'pointer' }}>
                                {m.label} {m.label === 'Efectivo' && <span style={{ color: C.muted, fontSize: 9 }}>(quitar de lista)</span>}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 700, color: C.amber }}>{money(v.total)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>);
    }

              </select>
              <button onClick={() => setScreen('login')} type="button" style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: `1px solid ${C.border}`, borderRadius: 8, padding: '7px 14px', color: C.textDim, cursor: 'pointer', fontFamily: 'Inter', fontSize: 12 }}>
                <I.LogOut size={14} /> Salir
              </button>
            </div>
          </div>
        </div>
        {/* TABS */}
        <div style={{ borderBottom: `1px solid ${C.border}`, padding: '12px 20px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}><TabBar tabs={adminTabs} active={seccion} onChange={setSeccion} /></div>
        </div>
        {/* CONTENT */}
        <div style={{ flex: 1, padding: '22px 20px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            {seccion === 'resumen' && <ResumenAdmin estacion={estacion} />}
            {seccion === 'tanques' && <ControlTanquesAdmin estacion={estacion} />}
            {seccion === 'comprobantes' && <ComprobantesAdmin estacion={estacion} ventas={ventas} setVentas={setVentas} productos={PRODUCTOS} />}
            {seccion === 'trabajadores' && <TrabajadoresAdmin />}
            {seccion === 'reportes' && <ReportesAdmin />}
          </div>
        </div>
      </div>);
    }

    /* ===================== RENDER ===================== */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
